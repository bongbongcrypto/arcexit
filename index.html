function banner(kind,html){ return '<div class="rbn '+kind+'">'+html+'</div>'; }
/* Wallets and RPCs throw developer text ("execution reverted", "-32603",
   "user rejected"). Showing that raw makes a normal cancel look like a crash,
   so translate the cases people actually hit and keep the original underneath
   for anyone who wants it. */
function humanError(e){
  const code=e&&(e.code!==undefined?e.code:(e.data&&e.data.code));
  const raw=String((e&&e.message)||e||"");
  const low=raw.toLowerCase();
  let key=null;
  if(code===4001||low.includes("user rejected")||low.includes("user denied")
     ||low.includes("rejected the request")) key="err_rejected";
  else if(low.includes("insufficient funds")||low.includes("insufficient balance")) key="err_gas";
  else if(low.includes("chain")&&(low.includes("switch")||low.includes("unrecognized"))) key="err_chain";
  else if(low.includes("nonce")) key="err_nonce";
  else if(low.includes("rpc no answer")||low.includes("failed to fetch")
          ||low.includes("networkerror")||low.includes("no receipt")) key="err_net";
  else if(low.includes("execution reverted")||low.includes("reverted")) key="err_revert";
  if(!key) return esc(raw);
  const detail=raw&&raw.length<200?'<div class="sub" style="margin-top:6px">'+esc(raw)+'</div>':"";
  return t(key)+detail;
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ============ exit: Arc -> Base ============ */
async function burnOnce(amount,recipient){
  const lane=await pickLane(ARC_DOMAIN,DST.domain,amount);
  const data=SEL.depositForBurn+pad32(hexNum(amount))+pad32(hexNum(DST.domain))
    +pad32(recipient)+pad32(ARC_USDC)+"".padStart(64,"0")
    +pad32(hexNum(lane.maxFee))+pad32(hexNum(lane.finality));
  return sendTx(TOKEN_MESSENGER,data,ARC_CHAIN_ID);
}
async function runExit(){
  const amount=parseUsdc($("amount").value);
  // Re-validate at send time rather than trusting what was typed earlier: the
  // field could have been edited after the last render, and a mistyped
  // recipient cannot be undone once the burn lands.
  const recipient=(RECIP&&ADDR_RE.test(RECIP))?RECIP:ACCT;
  RUNNING=true; updateCTA(); renderSteps("out");
  try{
    mark("st-guard","active","…");
    const a=await checkAttesting();
    if(!a.open){ mark("st-guard","fail","");
      say('<span style="color:var(--bad)"><b>'+t("run_stop")+'</b> '+t("run_stop_d")+'</span>');
      return; }
    mark("st-guard","done",a.done+"/"+a.total);

    // live per-message cap; split into pieces as needed
    let lim=LIMIT_ARC;
    try{ const l=numHex(await ethCall(TOKEN_MINTER,SEL.burnLimit+pad32(ARC_USDC)));
      if(l>0n){ lim=l; LIMIT_ARC=l; } }catch(e){}

    if(BATCH_CONTRACT){ await runExitBatch(amount,recipient,lim); return; }

    // No batch contract needed to charge: take the fee as a plain transfer on
    // Arc, exactly as the deposit side does. The contract only ever bought
    // batching, never the ability to collect, and deploying it costs Arc gas
    // we may not have yet. Fee first, so a failure here cannot burn funds the
    // user was not charged for.
    const exempt=await isFeeExempt(ACCT);
    const bps=exempt?0n:BigInt(DEFAULT_FEE_BPS);
    const principal=amount*10000n/(10000n+bps);
    const svcFee=amount-principal;

    let remaining=principal, pieces=[];
    while(remaining>0n){ const p=remaining>lim?lim:remaining; pieces.push(p); remaining-=p; }

    const burnHashes=[];
    let batched=false;
    // Ask the wallet to fold the whole exit into one confirmation. Only worth
    // it past a single piece, and only if the wallet says it can do Arc.
    if(pieces.length>1&&await walletBatchOK(ARC_HEX)){
      try{
        const laneB=await pickLane(ARC_DOMAIN,DST.domain,pieces[0]);
        // A batch executes as one transaction, so it answers to the same 30M
        // block gas limit as the contract route: ~45k per burn means about 400
        // fits. Emptying a 679 USDC balance is 679 burns, which in a single
        // batch would simply not fit in a block, so split it the same way.
        const CHUNK=Number(BURNS_PER_CALL);
        const groups=[];
        for(let i=0;i<pieces.length;i+=CHUNK) groups.push(pieces.slice(i,i+CHUNK));
        const burnCall=p=>({to:TOKEN_MESSENGER,
          data:SEL.depositForBurn+pad32(hexNum(p))+pad32(hexNum(DST.domain))
            +pad32(recipient)+pad32(ARC_USDC)+"".padStart(64,"0")
            +pad32(hexNum(laneB.maxFee))+pad32(hexNum(laneB.finality))});
        mark("st-approve","done","");
        mark("st-burn","active",pieces.length+" → "+groups.length);
        say(pieces.length+t("run_burns"));
        await ensureChain(ARC_CHAIN_ID);
        // Record each hash the instant the wallet names it, not after the batch
        // confirms, so Recover can always reach the funds even if this session
        // ends here.
        const seen=[];
        const keep=h=>{ if(seen.includes(h)) return;
          seen.push(h); burnHashes.push(h);
          saveBurn({tx:h,amount:principal.toString(),dir:"out",batch:true,
            at:new Date().toISOString().slice(0,16)});
          updateRecBadge(); };
        for(let g=0;g<groups.length;g++){
          const calls=[];
          // Fee and allowance are set once, in the first batch; the allowance
          // covers every group that follows.
          if(g===0){
            if(svcFee>0n) calls.push({to:ARC_USDC,
              data:SEL.transfer+pad32(FEE_RECIPIENT)+pad32(hexNum(svcFee))});
            calls.push({to:ARC_USDC,
              data:SEL.approve+pad32(TOKEN_MESSENGER)+pad32(hexNum(principal))});
          }
          for(const p of groups[g]) calls.push(burnCall(p));
          const id=await sendCalls(calls,ARC_HEX);
          // Past this line the calls are with the wallet. Retrying the
          // sequential path now could burn the same funds twice, so failures
          // must surface instead of falling through.
          batched=true;
          await waitCalls(id,null,keep);
          mark("st-burn","active",(g+1)+" / "+groups.length);
        }
        mark("st-burn","done","");
      }catch(e){
        if(batched) throw e;
        batched=false;   // wallet refused before submitting; sign them one by one
      }
    }

    if(!batched){
      if(svcFee>0n){
        mark("st-approve","active",t("dep_fee_step"));
        const ftx=await sendTx(ARC_USDC,SEL.transfer+pad32(FEE_RECIPIENT)+pad32(hexNum(svcFee)),ARC_CHAIN_ID);
        await waitReceipt(ftx,ARC_CHAIN_ID);
      }
      mark("st-approve","active",t("sg2n"));
      const cur=numHex(await ethCall(ARC_USDC,SEL.allowance+pad32(ACCT)+pad32(TOKEN_MESSENGER)));
      if(cur<principal){
        const tx=await sendTx(ARC_USDC,SEL.approve+pad32(TOKEN_MESSENGER)+pad32(hexNum(principal)),ARC_CHAIN_ID);
        await waitReceipt(tx,ARC_CHAIN_ID);
      }
      mark("st-approve","done","");

      mark("st-burn","active","0 / "+pieces.length);
      say(pieces.length+t("run_burns"));
      for(let i=0;i<pieces.length;i++){
        const bh=await burnOnce(pieces[i],recipient);
        burnHashes.push(bh);
        saveBurn({tx:bh,amount:pieces[i].toString(),dir:"out",at:new Date().toISOString().slice(0,16)});
        await waitReceipt(bh,ARC_CHAIN_ID);
        mark("st-burn","active",(i+1)+" / "+pieces.length);
      }
      mark("st-burn","done","");
    }
    updateRecBadge();

    const {redeemed,expected}=await collectAll(burnHashes);
    const want=expected||pieces.length;
    if(redeemed===want) mark("st-mint","done","");
    say(banner(redeemed===want?"ok":"warn",
      '<b>'+(redeemed===want?t("ex_ok_t"):t("run_done"))+'</b><br>'
      +redeemed+"/"+want+t("run_arrived")));
    updateRecBadge();
    await refreshBalances();
  }catch(e){ say(banner("bad",'<b>'+t("failed_t")+'</b><br>'+humanError(e))); }
  finally{ RUNNING=false; updateCTA(); }
}

/* Batch route: the contract loops many burns inside one transaction and pulls
   principal + the service fee in the same call, so a $500 exit is 2 signatures
   (approve + batchExit) instead of ~1000. Called from inside runExit's
   try/finally, so RUNNING is released by the caller. */
async function runExitBatch(amount,recipient,cap){
  // The rate is read from the contract rather than hardcoded, because it can
  // be retuned on-chain; a stale copy here would misquote the user.
  const bps=await liveFeeBps();
  const D=10000n+BigInt(bps);
  // The user enters what leaves their balance, and the contract adds the fee
  // on top of principal, so principal = amount / (1 + rate).
  const P=amount*10000n/D;
  if(P<1n){ say('<span style="color:var(--bad)">'+t("cta_amount")+'</span>'); return; }
  let full=P/cap; const rem=P%cap;
  const calls=[];
  while(full>0n){ const n=full>BURNS_PER_CALL?BURNS_PER_CALL:full;
    calls.push({burns:n,each:cap}); full-=n; }
  if(rem>0n) calls.push({burns:1n,each:rem});
  if(!calls.length) calls.push({burns:1n,each:P});
  const grand=calls.reduce((s,c)=>{const p=c.burns*c.each;
    return s+p+p*BigInt(bps)/10000n;},0n);

  mark("st-approve","active",t("sg2n"));
  const curA=numHex(await ethCall(ARC_USDC,SEL.allowance+pad32(ACCT)+pad32(BATCH_CONTRACT)));
  if(curA<grand){
    const tx=await sendTx(ARC_USDC,SEL.approve+pad32(BATCH_CONTRACT)+pad32(hexNum(grand)),ARC_CHAIN_ID);
    await waitReceipt(tx,ARC_CHAIN_ID);
  }
  mark("st-approve","done","");

  // Base balance before any burn, so relay arrival can be measured honestly.
  let before=0n;
  try{ before=numHex(await dstCall(DST.usdc,SEL.balanceOf+pad32(recipient))); }catch(e){}

  mark("st-burn","active","0 / "+calls.length);
  const laneOut=await pickLane(ARC_DOMAIN,DST.domain,cap);
  const burnHashes=[];
  for(let i=0;i<calls.length;i++){
    const c=calls[i];
    // Pass the rate we quoted as the ceiling we accept, so a rate change
    // landing between our quote and this transaction reverts instead of
    // silently charging more.
    const data=SEL.batchExit+pad32(hexNum(c.burns))+pad32(hexNum(c.each))
      +pad32(hexNum(DST.domain))+pad32(recipient)
      +pad32(hexNum(laneOut.maxFee))+pad32(hexNum(laneOut.finality))
      +pad32(hexNum(bps));
    const bh=await sendTx(BATCH_CONTRACT,data,ARC_CHAIN_ID,Number(c.burns)*60000+500000);
    burnHashes.push(bh);
    saveBurn({tx:bh,amount:(c.burns*c.each).toString(),dir:"out",batch:true,
      at:new Date().toISOString().slice(0,16)});
    await waitReceipt(bh,ARC_CHAIN_ID);
    mark("st-burn","active",(i+1)+" / "+calls.length);
  }
  mark("st-burn","done","");
  updateRecBadge();

  // Collect here rather than waiting on Circle's relayer. It serves
  // app-mediated transfers and does not pick up these burns, so waiting only
  // ended in the user pressing Recover and signing once per message.
  const {redeemed,expected}=await collectAll(burnHashes);
  const want=expected||Number(P/cap)+1;
  if(redeemed>=want&&want>0){
    mark("st-mint","done","");
    const got=numHex(await dstCall(DST.usdc,SEL.balanceOf+pad32(recipient)))-before;
    say(banner("ok",'<b>'+t("ex_ok_t")+'</b><br>'
      +usdc(got>0n?got:P)+" USDC "+t("ex_ok_b")));
  }else{
    mark("st-mint","fail","");
    say(banner("warn",'<b>'+t("dep_slow_t")+'</b><br>'+redeemed+"/"+want+t("run_arrived")+'<br>'
      +burnHashes.map(h=>txLink(h,ARC_CHAIN_ID)).join(" ")));
  }
  updateRecBadge();
  await refreshBalances();
}

/* ============ deposit: any CCTP chain -> Arc ============
   The service fee is charged here as an ordinary transfer on the source chain
   rather than through a contract. Inbound has no per-message cap to work
   around, so a contract would buy nothing but a deployment on every source
   chain we support, each needing its own gas. The user signs one extra
   transfer instead, and the amount they typed is what leaves their balance. */
async function runDeposit(){
  const typed=parseUsdc($("amount").value);
  // An exempt wallet bridges the whole amount, so principal is not reduced.
  const exempt=await isFeeExempt(ACCT);
  const bps=exempt?0n:BigInt(DEPOSIT_FEE_BPS);
  const principal=typed*10000n/(10000n+bps);
  const fee=typed-principal;
  const amount=principal;
  RUNNING=true; updateCTA(); renderSteps("in");
  try{
    if(amount<=0n){ say('<span style="color:var(--bad)">'+t("cta_amount")+'</span>'); return; }
    // Inbound caps sit far above anything a user sends, but read it anyway.
    try{ const lim=numHex(await srcCall(TOKEN_MINTER,SEL.burnLimit+pad32(SRC.usdc)));
      if(lim>0n&&amount>lim){
        say('<span style="color:var(--bad)">'+t("over_cap")+usdc(lim)+' USDC</span>'); return; }
    }catch(e){}

    if(fee>0n&&!(await isFeeExempt(ACCT))){
      mark("ds-approve","active",t("dep_fee_step"));
      const ftx=await sendTx(SRC.usdc,SEL.transfer+pad32(FEE_RECIPIENT)+pad32(hexNum(fee)),SRC.chainId);
      await waitReceipt(ftx,SRC.chainId);
    }

    mark("ds-approve","active",t("sg2n"));
    const cur=numHex(await srcCall(SRC.usdc,SEL.allowance+pad32(ACCT)+pad32(TOKEN_MESSENGER)));
    if(cur<amount){
      const tx=await sendTx(SRC.usdc,SEL.approve+pad32(TOKEN_MESSENGER)+pad32(hexNum(amount)),SRC.chainId);
      await waitReceipt(tx,SRC.chainId);
    }
    mark("ds-approve","done","");

    mark("ds-burn","active","");
    // Base->Arc costs a small Circle fee; allow enough headroom that the
    // message can actually be executed, and tell the user the ceiling.
    // The discovery that made deposits deliverable: Circle's relayer only
    // picks up messages tagged with hookData "cctp-forward". Decoded from the
    // DepositForBurn events of transfers that actually arrived; plain
    // depositForBurn without the tag sat unserved for hours. The fee ceiling
    // is kept tight (~just above the observed 0.0172 charge) because the tag
    // ecosystem pays exact quotes, not generous ceilings.
    const lane=await pickLane(SRC.domain,ARC_DOMAIN,amount);
    const hook=strip(HOOK_TAG);
    const maxFee=lane.free?0n:FWD_MAX_FEE;
    const data=SEL.depositForBurnWithHook+pad32(hexNum(amount))+pad32(hexNum(ARC_DOMAIN))
      +pad32(ACCT)+pad32(SRC.usdc)+"".padStart(64,"0")
      +pad32(hexNum(maxFee))+pad32(hexNum(lane.finality))
      +pad32(hexNum(256))                          // offset of hookData (8 words)
      // Delivered transfers carry the tag as a 32-byte value, zero padded,
      // not a 12-byte string. Mimic them byte for byte.
      +pad32(hexNum(32))
      +hook.padEnd(64,"0");
    const burnTx=await sendTx(TOKEN_MESSENGER,data,SRC.chainId);
    saveBurn({tx:burnTx,amount:amount.toString(),dir:"in",src:SRC.key,
      at:new Date().toISOString().slice(0,16)});
    say(t("run_hash")+txLink(burnTx,SRC.chainId));
    await waitReceipt(burnTx,SRC.chainId);
    mark("ds-burn","done","");

    mark("ds-mint","active",t("sg4n"));
    // Base needs its own finality before Circle will sign, which really does
    // take ~15 minutes. Say that out loud with a live clock, or the wait looks
    // like a failure.
    const t0=Date.now();
    const msg=await pollAttestation(burnTx,SRC.domain,(s,i)=>{
      const el=Math.round((Date.now()-t0)/1000);
      mark("ds-mint","active",Math.floor(el/60)+"분 "+(el%60)+"초");
      say(banner("wait",t("dep_waiting")+" "+Math.floor(el/60)+t("min")
        +"<br>"+t("dep_wait_note")+"<br>"+txLink(burnTx,SRC.chainId)));
    });
    if(!msg){ mark("ds-mint","fail","");
      say(banner("warn",'<b>'+t("dep_slow_t")+'</b><br>'+t("dep_slow_b")
        +'<br>'+txLink(burnTx,SRC.chainId))); return; }

    // Once Circle has signed, the mint can be submitted by anyone. A relayer
    // usually does it, which matters because a first-time depositor has no Arc
    // gas and physically cannot submit it themselves. So wait for the relayer,
    // and only offer to self-submit when the wallet can actually pay for it.
    const before=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(ACCT)));
    let landed=false;
    for(let i=0;i<24&&!landed;i++){
      say(banner("wait",t("run_wait_relay")+" ("+(i*5)+"s)<br>"+txLink(burnTx,SRC.chainId)));
      await new Promise(r=>setTimeout(r,5000));
      try{ const now=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(ACCT)));
        if(now>before) landed=true; }catch(e){}
    }
    if(landed){ mark("ds-mint","done","");
      markMinted(burnTx);
      say(banner("ok",'<b>'+t("dep_ok_t")+'</b><br>'+usdc(amount)+" USDC "+t("dep_ok_b")));
    }else{
      let gas=0n;
      try{ gas=numHex(await rpcRead("eth_getBalance",[ACCT,"latest"])); }catch(e){}
      if(gas<2000000000000000n){          // under ~0.002 USDC of Arc gas
        // Not a failure: the money is signed for and waiting. Say what is
        // actually true rather than letting a gas error surface.
        mark("ds-mint","active","");
        say(banner("warn",'<b>'+t("dep_relay_t")+'</b><br>'+t("dep_relay_b")
          +'<br>'+txLink(burnTx,SRC.chainId)));
        return;
      }
      mark("ds-mint","active",t("run_self"));
      const md=SEL.receiveMessage+encodeTwoBytes(msg.message,msg.attestation);
      const mt=await sendTx(TRANSMITTER,md,ARC_CHAIN_ID);
      await waitReceipt(mt,ARC_CHAIN_ID);
      markMinted(burnTx); mark("ds-mint","done","");
      say(banner("ok",'<b>'+t("dep_ok_t")+'</b><br>'+usdc(amount)+" USDC "+t("dep_ok_b")
        +"<br>"+txLink(mt,ARC_CHAIN_ID)));
    }
    await refreshBalances();
  }catch(e){ say(banner("bad",'<b>'+t("failed_t")+'</b><br>'+humanError(e))); }
  finally{ RUNNING=false; updateCTA(); }
}

/* ============ collect on the destination ============ */
/* Every burn has to be redeemed on the destination with its own receiveMessage.
   Leaving that to Circle's relayer was wrong: the relayer serves app-mediated
   transfers and does not pick up raw burns, so the page waited, gave up, and
   left the user to press Recover and then sign once per message. A 600 USDC
   exit meant 600 confirmations.
   So collect here, and fold the calls into as few batches as the destination
   block can carry. Anything already delivered is skipped by nonce, so this is
   safe to run even when the relayer did show up. */
const MINT_GAS=160000n;
async function mintGroups(msgs){
  let per=40;                       // conservative default if the read fails
  try{
    const blk=await dstRead("eth_getBlockByNumber",["latest",false]);
    const gl=numHex(blk.gasLimit);
    // Half a block, so a batch still lands when the chain is busy.
    if(gl>0n) per=Math.max(1,Math.min(msgs.length,Number(gl/2n/MINT_GAS)));
  }catch(e){}
  const out=[];
  for(let i=0;i<msgs.length;i+=per) out.push(msgs.slice(i,i+per));
  return out;
}
/* Send every receiveMessage, adapting when the wallet says no.
   A wallet can advertise atomic batching and still reject the batch it is
   handed - OKX returned status 400 on a 100-call batch. Throwing there stranded
   the user with a dead button. Unlike burning, minting is safe to retry: the
   transmitter rejects a nonce that was already used, and a rejected batch never
   executed at all. So shrink the batch and try again, and fall to one at a time
   only as the last resort. */
/* How many calls this wallet will actually accept in one batch. The block gas
   limit says 2,500 on Base; the wallet said 400 at 100. Wallet limits are not
   published and differ by vendor, so start at something conservative, keep what
   worked, and never start from the gas ceiling again. */
/* Start big. A refused batch (status 400) never reaches the chain and costs
   nothing but a few seconds, so there is no reason to be timid on the first
   try: if the wallet takes 100 the whole claim is one signature. A batch that
   executed and reverted (500) did burn gas, so that one steps down harder. */
const MINT_BATCH_DEFAULT=100;
/* Collecting through a contract instead of the wallet's batch API. The wallet
   route is capped at an undocumented size the wallet refuses past, so a large
   withdrawal became many confirmations. This contract loops receiveMessage
   itself: one signature, bounded only by the block. It holds nothing, approves
   nothing and cannot redirect a transfer - funds go to the mintRecipient sealed
   inside each attested message. Deployed on Base. */
const CLAIM_CONTRACT="0x174a6cf1382a2e496dbc642461711b59e5d4e0b7";
let CLAIM_LAST_ERROR="";
const SEL_CLAIM="0xf415c5e5";   // claim(bytes[],bytes[])
// A dynamic bytes element: its length, then the data padded to a 32-byte boundary.
function abiBytes(x){
  const b=strip(x), len=b.length/2;
  return pad32(hexNum(len))+b+"0".repeat(((32-(len%32))%32)*2);
}
// bytes[]: the count, then one offset per element (measured from just past the
// count), then the elements themselves.
function abiBytesArray(arr){
  const items=arr.map(abiBytes);
  let off=32*arr.length;
  const offs=items.map(it=>{ const o=off; off+=it.length/2; return pad32(hexNum(o)); });
  return pad32(hexNum(arr.length))+offs.join("")+items.join("");
}
function encodeClaim(msgs){
  const A=abiBytesArray(msgs.map(m=>m.message));
  const B=abiBytesArray(msgs.map(m=>m.attestation));
  const head=64;                       // two offsets, both parameters dynamic
  return SEL_CLAIM+pad32(hexNum(head))+pad32(hexNum(head+A.length/2))+A+B;
}
// Cached for the synchronous details render; refreshed alongside the status.
let CLAIM_PER_CALL=200;
// How many messages one claim() call can carry on this chain.
async function claimPerCall(){
  try{
    const blk=await dstRead("eth_getBlockByNumber",["latest",false]);
    const gl=numHex(blk.gasLimit);
    if(gl>0n) return Math.max(1,Number(gl/2n/MINT_GAS));
  }catch(e){}
  return 200;
}
function batchHint(chainId){
  try{ const v=Number(localStorage.getItem("arcMintBatch:"+chainId));
    if(v>=1) return v; }catch(e){}
  return MINT_BATCH_DEFAULT;
}
function rememberBatch(chainId,n){
  try{ localStorage.setItem("arcMintBatch:"+chainId,String(Math.max(1,n))); }catch(e){}
}
// What the user is about to be asked to sign, before they press anything.
async function mintSignatures(count,chainId){
  if(count<1) return 0;
  if(count===1) return 1;
  let per=1;
  if(CLAIM_CONTRACT&&chainId===BASE_CHAIN_ID){ per=await claimPerCall(); }
  else{ try{ if(await walletBatchOK(hexNum(chainId))) per=batchHint(chainId); }catch(e){} }
  return Math.ceil(count/Math.max(1,per));
}
async function mintAll(msgs,chainId,onProg){
  const dstHex=hexNum(chainId);
  const data=m=>SEL.receiveMessage+encodeTwoBytes(m.message,m.attestation);
  const total=msgs.length;

  // Preferred route: one ordinary transaction that loops inside the contract.
  // No wallet batching, so no undocumented wallet ceiling to run into.
  if(CLAIM_CONTRACT&&chainId===BASE_CHAIN_ID&&total>1){
    try{
      const per=Math.min(total,await claimPerCall());
      let sent=0;
      for(let i=0;i<msgs.length;i+=per){
        const grp=msgs.slice(i,i+per);
        onProg&&onProg("wallet",sent,total,grp.length);
        const tx=await sendTx(CLAIM_CONTRACT,encodeClaim(grp),chainId,grp.length*180000+120000);
        await waitReceipt(tx,chainId);
        sent+=grp.length;
        onProg&&onProg("sending",sent,total,per);
      }
      return sent;
    }catch(e){
      // Still fall through rather than stranding the claim, but say why. A
      // silent fallback here is what hid a broken contract call behind a pile
      // of wallet confirmations for hours.
      CLAIM_LAST_ERROR=String((e&&e.message)||e).slice(0,160);
      try{ console.warn("claim contract failed, falling back:",CLAIM_LAST_ERROR); }catch(_){}
      onProg&&onProg("fallback",0,total,1);
    }
  }

  let done=0, queue=msgs.slice(), per=1;
  if(total>1&&await walletBatchOK(dstHex)){
    try{
      await ensureChain(chainId);
      // Bounded by what the chain can carry AND by what this wallet has proven
      // it will take.
      const byGas=(await mintGroups(queue))[0].length;
      per=Math.max(1,Math.min(byGas,batchHint(chainId)));
    }catch(e){ per=1; }
  }
  while(queue.length){
    if(per>1){
      const grp=queue.slice(0,per);
      try{
        onProg&&onProg("wallet",done,total,grp.length);
        const id=await sendCalls(grp.map(m=>({to:TRANSMITTER,data:data(m)})),dstHex);
        onProg&&onProg("sending",done,total,grp.length);
        await waitCalls(id);
        queue=queue.slice(per); done+=grp.length;
        rememberBatch(chainId,per);   // this size works on this wallet
        onProg&&onProg("sending",done,total,per);
        continue;
      }catch(e){
        // A refusal cost nothing, so step down gently and keep the useful size.
        // A revert already spent gas, so drop straight to one at a time rather
        // than paying for another failed attempt.
        per=(e&&e.free===false)?1:(per>8?Math.floor(per/4):1);
        rememberBatch(chainId,per);   // where to start next time
        onProg&&onProg("smaller",done,total,per);
        continue;
      }
    }
    onProg&&onProg("wallet",done,total,1);
    const tx=await sendTx(TRANSMITTER,data(queue[0]),chainId);
    await waitReceipt(tx,chainId);
    queue=queue.slice(1); done++;
    onProg&&onProg("sending",done,total,1);
  }
  return done;
}
async function collectAll(burnHashes){
  let redeemed=0, expected=0;
  const toMint=[];
  mark("st-attest","active",t("sg4n"));
  for(const bh of burnHashes){
    const msgs=await pollAttestationAll(bh,ARC_DOMAIN,
      (s,i)=>mark("st-attest","active",s+" "+(i*15)+"s"));
    if(!msgs.length){ say(t("run_delay")+txLink(bh,ARC_CHAIN_ID)); continue; }
    expected+=msgs.length;
    for(const msg of msgs){
      // The relayer may have delivered this one already; submitting twice
      // reverts, so check the nonce before spending gas on it.
      const n=msgNonce(msg);
      if(n){ try{ if(numHex(await dstCall(TRANSMITTER,SEL.usedNonces+pad32(n)))>0n){
        redeemed++; continue; } }catch(e){} }
      toMint.push(msg);
    }
    markMinted(bh);
  }
  mark("st-attest","done","");
  if(!toMint.length) return {redeemed,expected};

  mark("st-mint","active",t("sg5n"));
  redeemed+=await mintAll(toMint,DST.chainId,
    (phase,done,total)=>mark("st-mint","active",done+" / "+total));
  return {redeemed,expected};
}

/* ============ account delegation (EIP-7702) ============ */
/* A delegated EOA carries 0xef0100 followed by the 20-byte delegate address, so
   the state is readable from any node and does not have to be taken on trust
   from the wallet UI. Revoking is a wallet-side action that no page can perform,
   but confirming that it actually happened is exactly what this is for. */
const KNOWN_DELEGATES={
  // Published in okxlabs/okx-smart-wallet-evm with audits; deployed on Ethereum,
  // X Layer, Base, Optimism, Arbitrum, BSC and Polygon. Notably NOT on Arc.
  "0xe40ccb2d94975c51bff0c004efdfd9b3a5796fa4":"deleg_known"
};
function delegChains(){
  const list=[{name:"Arc",rpcs:ARC_RPCS}];
  for(const s of SOURCES) list.push({name:s.name,rpcs:s.rpcs});
  return list;
}
// Each scan is many awaited round trips, so a second one started while the
// first is still walking chains would append its rows alongside them. Only the
// newest scan is allowed to write.
let DELEG_SCAN=0;
async function scanDelegation(){
  if(!ACCT){ $("deleg-msg").textContent=t("deleg_conn"); return; }
  const my=++DELEG_SCAN;
  $("deleg-msg").textContent="…";
  $("deleg-list").innerHTML="";
  let anyDelegated=false;
  // Collect first and paint once. Writing rows as they arrive lets a superseded
  // scan land a row between awaits, which showed up as duplicate chains.
  const rows=[];
  for(const c of delegChains()){
    if(my!==DELEG_SCAN) return;
    let code=null;
    try{ code=await rpcVia(c.rpcs,"eth_getCode",[ACCT,"latest"]); }catch(e){}
    let right,cls="",note="";
    if(code===null||code===undefined){ right="?"; }
    else if(code==="0x"){ right=t("deleg_none"); cls="ok"; }
    else{
      const s=code.toLowerCase();
      if(s.startsWith("0xef0100")){
        anyDelegated=true;
        const to="0x"+s.slice(8,48);
        const key=KNOWN_DELEGATES[to];
        // A delegate with no code is not a drain risk, but nothing works
        // through it either, so say that rather than calling it fine.
        note=key?t(key):t("deleg_unknown");
        try{ const dc=await rpcVia(c.rpcs,"eth_getCode",[to,"latest"]);
          if(dc==="0x") note=t("deleg_nocode"); }catch(e){}
        right=t("deleg_yes")+" · "+short(to);
        cls=key?"warn":"bad";
      }else{ right="contract account"; cls="warn"; }
    }
    rows.push('<div class="hrow"><span class="l">'+esc(c.name)
      +(note?'<span class="sub" style="display:block">'+esc(note)+'</span>':"")
      +'</span><span class="pill '+cls+'">'+esc(right)+'</span></div>');
  }
  if(my!==DELEG_SCAN) return;
  $("deleg-list").innerHTML=rows.join("");
  $("deleg-msg").textContent=anyDelegated?t("deleg_how"):"";
}

/* ============ recover ============ */
/* One burn tx from the batch contract carries MANY messages (up to 600 user
   pieces plus the fee pieces), so recovery walks every message in the tx,
   skips the ones already minted (usedNonces on the destination transmitter),
   and submits the rest. Also correct for plain single-message txs. */
function msgNonce(m){
  // v2 message header: version(4) srcDomain(4) dstDomain(4) nonce(32)
  const b=strip(m.message||"");
  return b.length>=88?"0x"+b.slice(24,88):null;
}
async function recover(mintIt){
  const tx=$("burntx").value.trim();
  if(!/^0x[0-9a-fA-F]{64}$/.test(tx)){ $("rec-msg").textContent="0x… 64 hex"; return; }
  $("rec-msg").textContent="…";
  try{
    const r=await fetch(IRIS+"/messages/"+ARC_DOMAIN+"?transactionHash="+tx);
    const d=await r.json(); const msgs=(d&&d.messages)||[];
    if(!msgs.length){ $("rec-msg").textContent=t("rec_norec"); return; }
    const complete=msgs.filter(m=>m.status==="complete"&&String(m.attestation||"").startsWith("0x"));
    if(!complete.length){ $("rec-msg").textContent="status: "+(msgs[0].status||"?"); return; }
    // Which of the attested messages still need a mint?
    const todo=[];
    let minted=0;
    for(const m of complete){
      const n=msgNonce(m);
      let used=false;
      if(n){ try{ used=numHex(await baseCall(TRANSMITTER,SEL.usedNonces+pad32(n)))>0n; }catch(e){} }
      if(used) minted++; else todo.push(m);
    }
    if(!mintIt){
      $("rec-msg").innerHTML='<span class="pill ok">'+t("rec_attested")+'</span> '
        +minted+"/"+complete.length+(todo.length?'  <span class="pill warn">'+todo.length+' '+t("h_unclaimed")+'</span>':"");
      if(!todo.length&&complete.length===msgs.length){ markMinted(tx); updateRecBadge(); }
      return;
    }
    if(!todo.length){
      markMinted(tx); updateRecBadge();
      $("rec-msg").innerHTML='<span style="color:var(--ok)"><b>'+t("rec_done")+'</b></span> '
        +minted+"/"+complete.length;
      return;
    }
    if(!ACCT){ await connectFlow(); if(!ACCT) return; }
    let done=0;
    const mintData=m=>SEL.receiveMessage+encodeTwoBytes(m.message,m.attestation);
    // One batch tx can carry hundreds of these, and a batched burn produces
    // hundreds. Signing them one by one is what made recovering a large exit
    // unusable.
    let batched=false;
    const dstHex=hexNum(BASE_CHAIN_ID);
    if(todo.length>1&&await walletBatchOK(dstHex)){
      try{
        await ensureChain(BASE_CHAIN_ID);
        const groups=await mintGroups(todo);
        for(let g=0;g<groups.length;g++){
          const id=await sendCalls(groups[g].map(m=>({to:TRANSMITTER,data:mintData(m)})),dstHex);
          batched=true;
          await waitCalls(id);
          done+=groups[g].length;
          $("rec-msg").textContent=done+"/"+todo.length;
        }
      }catch(e){ if(batched) throw e; batched=false; }
    }
    if(!batched) for(const m of todo){
      const mt=await sendTx(TRANSMITTER,mintData(m),BASE_CHAIN_ID);
      await waitReceipt(mt,BASE_CHAIN_ID);
      done++; $("rec-msg").innerHTML=txLink(mt,BASE_CHAIN_ID)+' '+done+"/"+todo.length;
    }
    if(done===todo.length&&complete.length===msgs.length){ markMinted(tx); }
    updateRecBadge();
    $("rec-msg").innerHTML='<span style="color:var(--ok)"><b>'+t("rec_done")+'</b></span> '
      +(minted+done)+"/"+complete.length;
  // Scroll the outcome into view: under a long pending list the result line is
  // off screen, and a press that reported an error looked like a dead button.
  }catch(e){ recSay(humanError(e)); }
}
/* The scan walks 140,000 blocks and then asks Circle about each burn it found,
   which takes a while. Showing only "…" for all of it made a working search look
   like a dead button, so report which stage it is on and how far along. */
function recProg(html){ $("rec-prog").innerHTML=html||""; }
async function detectPending(){
  if(!ACCT){ recProg(t("rec_conn2")); return; }
  $("pending").innerHTML=""; $("rec-msg").innerHTML="";
  const WINDOWS=14;
  recProg(t("rec_scan1")+" 0/"+WINDOWS);
  const head=Number(numHex(await rpcRead("eth_blockNumber",[])));
  // depositor is an indexed field on DepositForBurn, so the node can filter to
  // this wallet instead of the page pulling every burn on the chain and asking
  // for each transaction one at a time. That was ~66 extra round trips per
  // window and put the whole scan around six minutes.
  const mine=[]; let frm=head;
  const topicsFor=who=>[TOPIC_DEPOSIT_BURN,null,"0x"+pad32(who)];
  for(let w=0;w<WINDOWS;w++){ const a=Math.max(0,frm-9999);
    const range={fromBlock:hexNum(a),toBlock:hexNum(frm)};
    // Burns this wallet signed directly.
    try{ const logs=await rpcRead("eth_getLogs",[{...range,topics:topicsFor(ACCT)}]);
      for(const lg of (logs||[])) if(!mine.includes(lg.transactionHash)) mine.push(lg.transactionHash);
    }catch(e){}
    // Burns the batch contract made. The depositor there is the contract, so
    // these still need the sender checked - but there are few of them.
    if(BATCH_CONTRACT){
      try{ const logs=await rpcRead("eth_getLogs",[{...range,topics:topicsFor(BATCH_CONTRACT)}]);
        const seen=new Set();
        for(const lg of (logs||[])){
          if(seen.has(lg.transactionHash)||mine.includes(lg.transactionHash)) continue;
          seen.add(lg.transactionHash);
          try{ const tx=await rpcRead("eth_getTransactionByHash",[lg.transactionHash]);
            if(tx&&tx.from&&tx.from.toLowerCase()===ACCT.toLowerCase()) mine.push(lg.transactionHash);
          }catch(e){}
        }
      }catch(e){}
    }
    frm=a-1;
    recProg(t("rec_scan1")+" "+(w+1)+"/"+WINDOWS+" · "+mine.length+t("rec_found"));
  }
  // Ask Circle about several burns at once; one at a time made 37 transactions
  // take the better part of a minute with nothing on screen.
  // "Attested" is not "still owed". Listing every attested burn showed 37 rows
  // when none of them had anything left to collect, and sent the claim button
  // through work with nothing to do. Check the nonce on the destination and
  // keep only what is genuinely outstanding.
  const pending=[];
  let asked=0;
  for(let i=0;i<mine.length;i+=6){
    const slice=mine.slice(i,i+6);
    await Promise.all(slice.map(async tx=>{
      try{
        const r=await fetch(IRIS+"/messages/"+ARC_DOMAIN+"?transactionHash="+tx);
        const d=await r.json();
        const done=((d&&d.messages)||[]).filter(m=>m.status==="complete"
          &&String(m.attestation||"").startsWith("0x"));
        const used=await Promise.all(done.map(async m=>{
          const n=msgNonce(m);
          if(!n) return false;
          try{ return numHex(await baseCall(TRANSMITTER,SEL.usedNonces+pad32(n)))>0n; }
          catch(e){ return false; }
        }));
        if(used.some(u=>!u)) pending.push(tx);
        else if(done.length) markMinted(tx);
      }catch(e){}
      asked++; recProg(t("rec_scan2")+" "+asked+"/"+mine.length);
    }));
  }
  const uniq=[...new Set(pending)];
  recProg("");
  if(!uniq.length){ $("pending").textContent=t("rec_none"); return; }
  // Say how many wallet confirmations this will cost before they commit to it.
  // A button that silently turns into four popups is how people get scared off
  // halfway through a withdrawal.
  let msgCount=0;
  for(const tx of uniq){
    try{ const r=await fetch(IRIS+"/messages/"+ARC_DOMAIN+"?transactionHash="+tx);
      const d=await r.json();
      msgCount+=((d&&d.messages)||[]).filter(m=>m.status==="complete").length;
    }catch(e){}
  }
  const sigs=await mintSignatures(msgCount,BASE_CHAIN_ID);
  $("pending").innerHTML="<b>"+t("rec_pending")+"</b>"
    +'<div class="mnote" style="margin-top:6px">'+msgCount+t("rec_pieces")
    +' · <b>'+t("sig_about")+" "+sigs+t("sig_times")+'</b></div>'
    +'<button class="sbtn primary" id="rec-all" style="width:100%;margin-top:8px">'
    +t("rec_all")+" ("+uniq.length+")</button>"
    +uniq.map(tx=>
    '<div class="hrow" style="margin-top:8px">'+txLink(tx,ARC_CHAIN_ID)
    +'<button class="sbtn" style="flex:0 0 auto;white-space:nowrap;padding:5px 12px" data-redeem="'+tx+'">'+t("rec_go")+'</button></div>').join("");
  document.querySelectorAll("[data-redeem]").forEach(b=>
    b.onclick=()=>{ $("burntx").value=b.getAttribute("data-redeem"); recover(true); });
  $("rec-all").onclick=()=>recoverAll(uniq);
}
/* Claiming one burn tx at a time is the thing that made a large exit unusable:
   a dozen rows meant a dozen presses and a dozen confirmations, and the result
   line sits below a long list where it is easy to miss. Gather every attested
   message across every pending transaction and send them together. */
// The manual single-hash flow reports here, directly under its own input.
function recSay(html){ $("rec-msg").innerHTML=html; }
/* Claim-all reports into rec-prog instead, which sits above the list. Writing
   below a 37-row list meant the page jumped to the bottom on every update and
   the button looked like it did nothing. */
async function recoverAll(txs){
  if(!txs||!txs.length){ recProg(t("rec_none")); return; }
  if(!ACCT){ await connectFlow(); if(!ACCT) return; }
  // The button itself has to show it was pressed. A bare counter under an
  // unchanged button reads as nothing happening.
  const btn=$("rec-all"), label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent=t("rec_busy"); }
  const restore=()=>{ if(btn){ btn.disabled=false; btn.textContent=label; } };
  recProg(t("rec_prep")+" 0/"+txs.length);
  try{
    const todo=[]; let already=0, seenMsgs=0, asked=0;
    // Ask Circle about several at a time and check the nonces in parallel;
    // sequentially this was about a minute of apparent silence for 37 burns.
    for(let i=0;i<txs.length;i+=6){
      await Promise.all(txs.slice(i,i+6).map(async tx=>{
        try{
          const r=await fetch(IRIS+"/messages/"+ARC_DOMAIN+"?transactionHash="+tx);
          const d=await r.json();
          const done=((d&&d.messages)||[]).filter(m=>m.status==="complete"
            &&String(m.attestation||"").startsWith("0x"));
          seenMsgs+=done.length;
          const used=await Promise.all(done.map(async m=>{
            const n=msgNonce(m);
            if(!n) return false;
            try{ return numHex(await baseCall(TRANSMITTER,SEL.usedNonces+pad32(n)))>0n; }
            catch(e){ return false; }
          }));
          done.forEach((m,k)=>{ if(used[k]) already++; else todo.push(m); });
        }catch(e){}
        asked++;
        recProg(t("rec_prep")+" "+asked+"/"+txs.length+" · "+todo.length);
      }));
    }
    if(!todo.length){
      txs.forEach(markMinted); updateRecBadge(); restore();
      recProg('<span style="color:var(--ok)"><b>'+t("rec_nothing")+'</b></span> '
        +already+"/"+seenMsgs);
      return;
    }
    // Say what is happening before the wallet popup: that is the one moment the
    // user has to act, and silence there reads as a hang.
    const done=await mintAll(todo,BASE_CHAIN_ID,(phase,n,total,size)=>{
      // Count the confirmations, not just the pieces: "서명 2/4" is what the
      // user is actually living through.
      const sigNo=Math.floor(n/Math.max(1,size))+1;
      const sigTot=Math.max(sigNo,Math.ceil(total/Math.max(1,size)));
      if(phase==="wallet") recProg(t("rec_wallet")+"<br>"+t("sig_about")+" "+sigNo+"/"+sigTot
        +" · "+(n+1)+"~"+Math.min(n+size,total)+"/"+total+t("rec_pieces"));
      else if(phase==="smaller") recProg(t("rec_retry")+" "+size);
      else recProg(t("rec_sending")+" "+n+"/"+total+t("rec_pieces"));
    });
    if(done===todo.length) txs.forEach(markMinted);
    updateRecBadge(); restore();
    recProg('<span style="color:var(--ok)"><b>'+t("rec_done")+'</b></span> '+(already+done)+"/"+seenMsgs);
    await refreshBalances();
  }catch(e){ restore(); recProg(humanError(e)); }
}

/* ============ cash out leftover tokens (Arc DEX -> USDC) ============
   For users who bought memecoins on Arc and want to leave with USDC. The quote
   picks whichever pool holds the most USDC (a shallow decoy pool would quote a
   fake high price), and the slippage estimate warns before a thin pool eats the
   trade. Selling still enforces a min-received on-chain, so a bad fill reverts. */
let HOLDINGS=[];
function decStr(hex){ if(!hex||hex==="0x")return "?"; const b=strip(hex);
  if(b.length>=128){ const len=parseInt(b.slice(64,128),16); let s="";
    for(let i=0;i<len;i++) s+=String.fromCharCode(parseInt(b.substr(128+i*2,2),16)); return s; } return "?"; }
async function poolsFor(token){
  const out=[];
  try{ const r=await ethCall(V2_FACTORY,SEL.getPair+pad32(token)+pad32(ARC_USDC));
    if(r&&numHex(r)) out.push({kind:"V2",fee:0,addr:"0x"+r.slice(-40)}); }catch(e){}
  for(const fee of FEE_TIERS){ try{
    const r=await ethCall(V3_FACTORY,SEL.getPool+pad32(token)+pad32(ARC_USDC)+pad32(hexNum(fee)));
    if(r&&numHex(r)) out.push({kind:"V3",fee,addr:"0x"+r.slice(-40)}); }catch(e){} }
  for(const p of out){ try{ p.usdc=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(p.addr)));
    p.tok=numHex(await ethCall(token,SEL.balanceOf+pad32(p.addr))); }catch(e){ p.usdc=0n;p.tok=0n; } }
  out.sort((a,b)=>(b.usdc>a.usdc?1:b.usdc<a.usdc?-1:0)); return out;
}
function quoteFromPool(p,amt){ if(!p||!p.tok||!p.usdc)return 0n; const f=amt*99n/100n; return f*p.usdc/(p.tok+f); }
// Total loss vs the pool's spot price (pool fee + price impact), as a percent.
function slippagePct(p,amt){
  if(!p||!p.tok||!p.usdc||amt<=0n) return 0;
  const r=Number(amt)/Number(p.tok);           // trade size relative to token reserve
  const ratio=0.99/(1+0.99*r);                 // out / out-at-spot
  return Math.max(0,(1-ratio)*100);
}
function slipClass(s){ return s<2?"low":s<6?"mid":s<15?"high":"vhigh"; }
function slipLabel(s){ return t(s<2?"co_slip_low":s<6?"co_slip_mid":s<15?"co_slip_high":"co_slip_vhigh"); }

async function loadHoldings(){
  if(!ACCT){ $("co-list").innerHTML='<div class="mnote" style="color:var(--dim)">'+t("cta_connect")+'</div>'; return; }
  $("co-msg").textContent=""; $("co-list").innerHTML='<div class="mnote" style="color:var(--dim)">'+t("co_scanning")+'</div>';
  const head=Number(numHex(await rpcRead("eth_blockNumber",[])));
  const seen=new Set(), padded="0x"+pad32(ACCT);
  for(let w=0;w<16;w++){ const to=head-w*20000, from=to-19999;
    for(const topics of [[TRANSFER_TOPIC,null,padded],[TRANSFER_TOPIC,padded]]){
      try{ const logs=await rpcRead("eth_getLogs",[{topics,fromBlock:hexNum(Math.max(0,from)),toBlock:hexNum(to)}]);
        (logs||[]).forEach(l=>seen.add(l.address.toLowerCase())); }catch(e){} } }
  seen.delete(ARC_USDC.toLowerCase());
  HOLDINGS=[];
  for(const tok of seen){ let bal=0n,dec=18,sym="?";
    try{ bal=numHex(await ethCall(tok,SEL.balanceOf+pad32(ACCT))); if(bal===0n)continue;
      dec=Number(numHex(await ethCall(tok,SEL.decimals)))||18; sym=decStr(await ethCall(tok,SEL.symbol));
    }catch(e){ continue; }
    const pools=await poolsFor(tok); const best=pools[0];
    const quote=best?quoteFromPool(best,bal):0n;
    HOLDINGS.push({tok,sym,dec,bal,best,quote,slip:best?slippagePct(best,bal):0}); }
  HOLDINGS.sort((a,b)=>(b.quote>a.quote?1:-1));
  renderCashout();
}
function renderCashout(){
  const el=$("co-list");
  const sellable=HOLDINGS.filter(h=>h.best&&h.quote>0n);
  if(!HOLDINGS.length){ el.innerHTML='<div class="mnote" style="color:var(--dim)">'+t("co_none")+'</div>'; return; }
  let total=0n; sellable.forEach(h=>total+=h.quote);
  let html="";
  if(sellable.length>1){
    html+='<div class="cohead"><span>'+t("co_total")+'</span><b style="color:var(--ok)">'+usdc(total)+' USDC</b></div>'
      +'<button class="sbtn primary" id="co-all" style="width:100%;margin-top:6px">'+t("co_sellall")+'</button>';
  }
  HOLDINGS.forEach((h,i)=>{
    const tail=h.tok.slice(-4), qty=(Number(h.bal)/10**h.dec);
    if(!h.best||h.quote===0n){
      html+='<div class="corow"><div class="cotop"><span><b>'+h.sym+'</b><span class="tail">…'+tail
        +'</span></span><span class="amt"><span class="slip high">'+t("co_noliq")+'</span></span></div></div>';
      return;
    }
    const s=h.slip, sc=slipClass(s);
    let warn="";
    if(sc==="high") warn='<div class="cowarn">'+t("co_warn_high")+'</div>';
    if(sc==="vhigh") warn='<div class="cowarn vhigh">'+t("co_warn_vhigh")+'</div>';
    html+='<div class="corow">'
      +'<div class="cotop"><span><b>'+h.sym+'</b><span class="tail">…'+tail+'</span></span>'
      +'<span class="amt"><b>'+usdc(h.quote)+' USDC</b></span></div>'
      +'<div class="cometa"><span>'+qty.toLocaleString(undefined,{maximumFractionDigits:4})+' '+h.sym+'</span>'
      +'<span>'+t("co_slip")+' <span class="slip '+sc+'">'+s.toFixed(1)+'% · '+slipLabel(s)+'</span></span></div>'
      +warn
      +'<div class="cobtns"><button class="sbtn" data-sell1="'+i+'">'+t("co_sell1")+'</button></div>'
      +'</div>';
  });
  el.innerHTML=html;
  const all=$("co-all"); if(all) all.onclick=()=>sellAll();
  el.querySelectorAll("[data-sell1]").forEach(b=>b.onclick=()=>sellOne(Number(b.getAttribute("data-sell1"))));
}
async function swapToken(h){
  // Re-quote right before selling; abort if the best pool moved or the quote
  // swung, then enforce a 5% min-out on-chain so a bad fill reverts.
  const fresh=await poolsFor(h.tok); const best2=fresh[0]; const q2=quoteFromPool(best2,h.bal);
  if(!best2||q2===0n) throw new Error(t("co_noliq"));
  if(best2.addr.toLowerCase()!==h.best.addr.toLowerCase()) throw new Error(t("co_unstable"));
  const diff=h.quote>q2?h.quote-q2:q2-h.quote;
  if(h.quote>0n&&diff*100n/h.quote>25n) throw new Error(t("co_unstable"));
  const minOut=q2*95n/100n;
  const spender=(best2.kind==="V3")?V3_APPROVE_SPENDER:V2_ROUTER;
  const cur=numHex(await ethCall(h.tok,SEL.allowance+pad32(ACCT)+pad32(spender)));
  if(cur<h.bal){ const tx=await sendTx(h.tok,SEL.approve+pad32(spender)+pad32(hexNum(h.bal)),ARC_CHAIN_ID);
    await waitReceipt(tx,ARC_CHAIN_ID); }
  let data,target;
  if(best2.kind==="V3"){ data=SEL.swapExactInput+pad32(V3_ROUTER)+pad32(h.tok)+pad32(ARC_USDC)
    +pad32(hexNum(best2.fee))+pad32(hexNum(h.bal))+pad32(hexNum(minOut)); target=SWAP_HELPER;
  }else{ const dl=BigInt(Math.floor(Date.now()/1000)+1800);
    data=SEL.swapExactTokensForTokens+pad32(hexNum(h.bal))+pad32(hexNum(minOut))+pad32(hexNum(160))
      +pad32(ACCT)+pad32(hexNum(dl))+pad32(hexNum(2))+pad32(h.tok)+pad32(ARC_USDC); target=V2_ROUTER; }
  const before=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(ACCT)));
  const stx=await sendTx(target,data,ARC_CHAIN_ID); await waitReceipt(stx,ARC_CHAIN_ID);
  const after=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(ACCT)));
  return after>before?after-before:0n;
}
async function sellOne(i){
  const h=HOLDINGS[i]; if(!h||!h.best) return;
  $("co-msg").innerHTML=t("co_selling");
  try{ const got=await swapToken(h);
    $("co-msg").innerHTML='<span style="color:var(--ok)"><b>'+t("co_done")+'</b></span> +'+usdc(got)+' USDC';
    await loadHoldings(); await refreshBalances();
  }catch(e){ $("co-msg").innerHTML='<span style="color:var(--bad)">'+humanError(e)+'</span>'; }
}
async function sellAll(){
  const list=HOLDINGS.filter(h=>h.best&&h.quote>0n);
  let done=0, got=0n;
  for(const h of list){
    $("co-msg").innerHTML=t("co_selling")+" "+(done+1)+"/"+list.length+" ("+h.sym+")";
    try{ got+=await swapToken(h); done++; }
    catch(e){ /* skip the ones that fail (thin/unstable), keep going */ }
  }
  $("co-msg").innerHTML='<span style="color:var(--ok)"><b>'+t("co_done")+'</b></span> '
    +done+"/"+list.length+" · +"+usdc(got)+" USDC";
  await loadHoldings(); await refreshBalances();
}

/* ============ direction / wiring ============ */
function applyDir(){
  renderChips(); renderBalances(); renderDetails(); updateCTA();
}
$("from-chain").onclick=()=>{ if(DIR==="in"&&!RUNNING) openChainPicker(false); };
$("to-chain").onclick=()=>{ if(DIR==="out"&&!RUNNING) openChainPicker(true); };
$("addr-edit").onclick=()=>{
  const row=$("row-custaddr");
  row.hidden=!row.hidden;
  if(!row.hidden){ $("custaddr").value=RECIP||ACCT||""; $("custaddr").focus(); }
  else { RECIP=null; $("addr-warn").textContent=""; $("addr-warn").className="addrwarn";
         renderDetails(); }
};
$("custaddr").oninput=()=>{
  const v=$("custaddr").value.trim();
  const w=$("addr-warn");
  if(!v){ RECIP=null; w.textContent=""; w.className="addrwarn"; renderDetails(); return; }
  if(!ADDR_RE.test(v)){
    RECIP=null; w.textContent=t("d_addr_bad"); w.className="addrwarn bad";
  }else if(ACCT&&v.toLowerCase()===ACCT.toLowerCase()){
    RECIP=null; w.textContent=t("d_addr_self"); w.className="addrwarn";
  }else{
    RECIP=v; w.textContent=t("d_addr_diff"); w.className="addrwarn ok";
  }
  renderDetails(); updateCTA();
};
$("dirswap").onclick=()=>{
  if(RUNNING||!DEPOSITS_ENABLED) return;
  DEP_ARMED=false;
  DIR=DIR==="out"?"in":"out";
  $("dirswap").classList.toggle("flip");
  $("prog").hidden=true;
  applyDir();
};
$("amount").oninput=()=>{ renderDetails(); updateCTA(); };
$("maxbtn").onclick=async()=>{
  if(!ACCT) return;
  try{
    if(DIR==="out"){
      const b=numHex(await ethCall(ARC_USDC,SEL.balanceOf+pad32(ACCT)));
      const keep=1000000n; const v=b>keep?b-keep:0n;   // leave 1 USDC for gas
      $("amount").value=(Number(v)/1e6).toFixed(6);
    }else{
      const b=numHex(await baseCall(BASE_USDC,SEL.balanceOf+pad32(ACCT)));
      $("amount").value=(Number(b)/1e6).toFixed(6);
    }
    renderDetails(); updateCTA();
  }catch(e){ alert(e.message); }
};
let DEP_ARMED=false;   // retained: harmless, and re-armed if a slow lane ever returns
$("cta").onclick=()=>{
  if(!ACCT){ connectFlow(); return; }
  if(RUNNING) return;
  if(DIR==="out") runExit(); else runDeposit();
};
$("h-wallet").onclick=()=>{
  if(!ACCT){ connectFlow(); return; }
  $("mm-addr").textContent=ACCT+(WNAME?"  ·  "+WNAME:"");
  openM("m-menu");
};
$("mm-copy").onclick=async()=>{
  try{ await navigator.clipboard.writeText(ACCT||""); $("mm-copy").textContent=t("mm_copied");
    setTimeout(()=>{$("mm-copy").textContent=t("mm_copy");},1200); }catch(e){}
};
$("mm-switch").onclick=()=>{ closeM("m-menu"); switchAccount(); };
$("mm-disc").onclick=disconnect;
$("refresh").onclick=async()=>{
  $("refresh").classList.add("spin");
  try{ await Promise.all([refreshStatus(),refreshBalances()]); }
  finally{ $("refresh").classList.remove("spin"); }
};
$("h-status").onclick=$("refresh").onclick;
$("link-cashout").onclick=()=>{ $("co-msg").textContent=""; $("co-list").innerHTML=""; openM("m-cashout");
  if(ACCT) loadHoldings().catch(e=>{$("co-msg").innerHTML=humanError(e);}); };
$("co-scan").onclick=()=>loadHoldings().catch(e=>{$("co-msg").innerHTML=humanError(e);});
$("link-history").onclick=()=>{ renderHistory(); openM("m-history"); };
$("link-recover").onclick=()=>{
  // Open on the one action that matters and start it, rather than presenting an
  // empty field and two buttons with no indication of which comes first.
  $("rec-msg").innerHTML=""; $("pending").innerHTML=""; recProg("");
  $("rec-manual").hidden=true;
  openM("m-recover");
  if(ACCT) detectPending().catch(e=>recProg(humanError(e)));
  else recProg(t("rec_conn2"));
};
$("rec-manual-t").onclick=()=>{ $("rec-manual").hidden=!$("rec-manual").hidden; };
$("link-guide").onclick=()=>{ openM("m-guide"); markGuideSeen(); };
/* First-visit prompt. The guide link sits in the footer, which a first-time
   visitor does not read; the one thing they must know before signing is that
   several confirmations are normal here, or the flow looks like an attack.
   Shown once, remembered after it is opened. */
function seenGuide(){ try{ return localStorage.getItem("arcGuideSeen")==="1"; }catch(e){ return true; } }
function markGuideSeen(){ try{ localStorage.setItem("arcGuideSeen","1"); }catch(e){}
  const el=$("first-hint"); if(el) el.hidden=true; }
$("first-open").onclick=()=>{ openM("m-guide"); markGuideSeen(); };
if(!seenGuide()){ const el=$("first-hint"); if(el) el.hidden=false; }

$("link-how").onclick=()=>openM("m-how");
$("link-deleg").onclick=()=>{ $("deleg-msg").textContent=""; $("deleg-list").innerHTML="";
  openM("m-deleg"); if(ACCT) scanDelegation(); };
$("btn-deleg-scan").onclick=()=>scanDelegation();
$("btn-detect").onclick=()=>detectPending().catch(e=>{$("pending").textContent=e.message;});
$("btn-recover").onclick=()=>recover(true);
$("btn-check").onclick=()=>recover(false);
document.querySelectorAll(".lang button").forEach(b=>
  b.onclick=()=>{ LANG=b.getAttribute("data-lang");
    try{ localStorage.setItem("arcExitLang",LANG); }catch(e){}
    applyLang(); });

function refreshAll(){ refreshBalances(); renderDetails(); updateCTA(); }

/* ============ init ============ */
try{ const k=localStorage.getItem("arcExitSrc"); if(k) SRC=srcByKey(k);
  const d=localStorage.getItem("arcExitDst"); if(d) DST=dstByKey(d); }catch(e){}
applyLang();
if(!DEPOSITS_ENABLED){ DIR="out"; $("dirswap").style.display="none"; }
applyDir();
$("build").textContent="["+BUILD+"]";
updateRecBadge();
refreshStatus();
refreshInflight().catch(()=>{});   // surviving transfers show up even after a reload
setTimeout(silentReconnect,350);
setTimeout(silentReconnect,1200); // providers can announce late
</script>
