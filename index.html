<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Single-file app: a cached copy silently serves old code, so never cache. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Move USDC between Arc mainnet and Base with Circle CCTP v2. Non-custodial: every transaction is signed in your own wallet, funds only touch Circle's official contracts.">
<meta property="og:title" content="Arc Bridge">
<meta property="og:description" content="USDC in and out of Arc mainnet via Circle CCTP. Non-custodial, no server.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="%234c82fb" stroke-width="3.1" stroke-linecap="round" stroke-dasharray="38 16" transform="rotate(-50 12 12)"/></svg>'>
<title>Arc Bridge · USDC between Arc and Base</title>
<style>
  :root{
    /* Restrained, single-accent palette. An earlier version leaned on a
       blue-to-violet gradient everywhere, which is the giveaway of a template
       rather than a product. One accent, used sparingly, reads as considered. */
    --bg:#0a0b0e; --card:#131519; --box:#1a1d23; --boxh:#20242b;
    --line:#24272f; --line2:#333844;
    --text:#f0f2f5; --dim:#9aa1ad; --dim2:#666d7a;
    --acc:#3d7bfd; --acc-dim:rgba(61,123,253,.12);
    --ok:#25c07f; --warn:#e79c3c; --bad:#ec5f5f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans KR","Noto Sans SC",sans-serif;
       -webkit-font-smoothing:antialiased}
  .bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;background:
    radial-gradient(760px 420px at 50% -12%, rgba(61,123,253,.07), transparent 68%)}
  header,main,footer{position:relative;z-index:1}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
         max-width:1100px;margin:0 auto;padding:18px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.2px}
  .brand svg{display:block}
  .hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .statuspill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
    background:var(--box);border:1px solid var(--line);font-size:12.5px;color:var(--dim);cursor:pointer;
    user-select:none}
  .statuspill .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
  .statuspill.open .dot{background:var(--ok);box-shadow:0 0 6px rgba(37,192,127,.8)}
  .statuspill.open{color:var(--ok);border-color:rgba(37,192,127,.35)}
  .statuspill.shut .dot{background:var(--bad)}
  .statuspill.shut{color:var(--bad);border-color:rgba(236,95,95,.35)}
  .statuspill.unknown .dot{background:var(--warn)}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--dim2);padding:6px 11px;font-size:12px;
    cursor:pointer;font-weight:600}
  .lang button.on{background:var(--box);color:var(--text)}
  .wbtn{display:flex;align-items:center;gap:8px;background:var(--box);border:1px solid var(--line);
    color:var(--text);border-radius:999px;padding:8px 15px;font:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer}
  .wbtn:hover{border-color:var(--line2)}
  .wbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .wbtn.cta-like{background:var(--acc);border:0;color:#fff}

  main{max-width:1100px;margin:0 auto;padding:26px 16px 40px}
  .card{width:min(440px,100%);margin:0 auto;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 50px rgba(0,0,0,.4)}
  .card-head{display:flex;align-items:center;justify-content:space-between;
    padding:4px 6px 12px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .iconbtn{background:transparent;border:0;color:var(--dim2);cursor:pointer;
    padding:5px;border-radius:8px;line-height:0;display:inline-flex}
  .iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:hover{color:var(--text);background:var(--box)}
  .iconbtn.spin{animation:sp 1s linear infinite}
  /* in-flight transfer strip: the answer to "did my money actually move?" */
  .flight{display:flex;align-items:center;gap:10px;background:rgba(61,123,253,.07);
    border:1px solid rgba(61,123,253,.28);border-radius:12px;padding:10px 13px;margin-bottom:10px;
    font-size:12.5px;line-height:1.5}
  .flight.done{background:rgba(37,192,127,.08);border-color:rgba(37,192,127,.35)}
  .flight.stale{background:rgba(231,156,60,.08);border-color:rgba(231,156,60,.35)}
  .flight .spinner{width:13px;height:13px;flex:0 0 auto;border-radius:50%;
    border:2px solid rgba(61,123,253,.3);border-top-color:var(--acc);animation:sp .9s linear infinite}
  .flight .tick{width:13px;height:13px;flex:0 0 auto;color:var(--ok)}
  .flight .body{flex:1;min-width:0}
  .flight .body b{color:var(--text);font-weight:600}
  .flight .sub{color:var(--dim2);font-size:11.5px}
  .flight .act{flex:0 0 auto;background:var(--box);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 10px;font:600 11.5px inherit;cursor:pointer}
  @keyframes sp{to{transform:rotate(360deg)}}

  .box{background:var(--box);border:1px solid transparent;border-radius:14px;padding:14px 15px;
    transition:border-color .13s}
  .box:focus-within{border-color:var(--line2)}
  .box+.swapwrap+.box{margin-top:0}
  .box-top{display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--dim2);margin-bottom:8px}
  .baltext b{color:var(--dim);font-weight:600}
  .maxb{background:rgba(61,123,253,.15);border:0;color:var(--acc);font-size:11px;font-weight:700;
    border-radius:6px;padding:2px 7px;margin-left:6px;cursor:pointer}
  .maxb:hover{background:rgba(61,123,253,.25)}
  .box-main{display:flex;align-items:center;gap:10px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px 7px 8px;flex:0 0 auto;user-select:none}
  .chip b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .chip.pickable{cursor:pointer}
  .chip.pickable:hover{border-color:var(--line2)}
  .chip .caret{color:var(--dim2);font-size:10px;margin-left:2px}
  .chip small{color:var(--dim2);font-size:10.5px;font-weight:600;margin-left:3px;letter-spacing:.02em}
  #amount{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);
    font:500 28px/1.2 inherit;letter-spacing:-.02em;text-align:right;padding:0}
  #amount::placeholder{color:var(--dim2)}
  .recv{flex:1;min-width:0;text-align:right;font:500 28px/1.2 inherit;letter-spacing:-.02em;
    color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recv.haveamt{color:var(--text)}

  .swapwrap{height:10px;position:relative;z-index:2}
  #dirswap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:34px;height:34px;border-radius:11px;background:var(--boxh);border:4px solid var(--card);
    color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .25s ease,color .13s,background .13s;padding:0}
  #dirswap:hover{color:var(--text);background:#272c35}
  #dirswap.flip{transform:translate(-50%,-50%) rotate(180deg)}

  .details{margin:12px 4px 4px;font-size:13px}
  .drow{display:flex;justify-content:space-between;gap:14px;padding:5px 2px;color:var(--dim2)}
  .drow>span:last-child{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;
    word-break:break-all}
  .drow.warn>span:last-child{color:var(--warn)}
  .linkbtn{background:none;border:0;color:var(--acc);font:inherit;font-size:11.5px;
    cursor:pointer;padding:0 0 0 8px;text-decoration:underline}
  .addrwarn{display:block;font-size:11.5px;margin-top:5px;line-height:1.5}
  .addrwarn.bad{color:var(--bad)}
  .addrwarn.ok{color:var(--warn)}
  .hint{margin:8px 6px 2px;font-size:12px;color:var(--dim2);line-height:1.5}
  .hint.caution{color:var(--text);background:rgba(231,156,60,.09);
    border:1px solid rgba(231,156,60,.32);border-radius:10px;padding:10px 12px;margin:10px 2px 2px}
  .hint.caution b{color:var(--warn)}

  .prog{margin:12px 4px 2px;border-top:1px solid var(--line);padding-top:12px}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{position:relative;padding:7px 0 7px 34px;font-size:13.5px;color:var(--dim)}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;
    width:22px;height:22px;border-radius:50%;background:var(--box);color:var(--dim2);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
  .steps li.active{color:var(--text)}
  .steps li.active::before{background:rgba(61,123,253,.2);color:var(--acc)}
  .steps li.done{color:var(--dim)}
  .steps li.done::before{content:"✓";background:rgba(37,192,127,.15);color:var(--ok)}
  .steps li.fail::before{content:"!";background:rgba(236,95,95,.15);color:var(--bad)}
  .steps .note{color:var(--dim2);font-size:12px;margin-left:6px}
  .runmsg{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.6;word-break:break-all}
  .rbn{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.65;margin-top:10px;
    word-break:break-word}
  .rbn.ok{background:rgba(37,192,127,.1);border:1px solid rgba(37,192,127,.4);color:var(--text)}
  .rbn.bad{background:rgba(236,95,95,.1);border:1px solid rgba(236,95,95,.4);color:var(--text)}
  .rbn.warn{background:rgba(231,156,60,.1);border:1px solid rgba(231,156,60,.4);color:var(--text)}
  .rbn.wait{background:rgba(61,123,253,.08);border:1px solid rgba(61,123,253,.3);color:var(--text)}

  .cta{width:100%;margin-top:12px;height:52px;border:0;border-radius:13px;cursor:pointer;
    font:600 15.5px inherit;letter-spacing:-.01em;color:#fff;background:var(--acc);
    transition:background .13s}
  .cta:hover:not(:disabled){background:#3570e8}
  .cta:disabled{background:var(--box);color:var(--dim2);cursor:not-allowed}
  .cta.danger{background:var(--boxh);color:var(--bad)}
  .trust{margin:10px 6px 2px;text-align:center;font-size:11.5px;color:var(--dim2);line-height:1.6}

  /* These are actions, so they must read as buttons - plain underlined-looking
     text got mistaken for legal fine print. Line icons, never emoji. */
  .links{display:flex;justify-content:center;gap:8px;margin-top:16px;font-size:13px;flex-wrap:wrap}
  .links a{color:var(--dim);cursor:pointer;text-decoration:none;position:relative;
    display:inline-flex;align-items:center;gap:7px;background:var(--box);
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;
    transition:color .13s,border-color .13s}
  .links a:hover{color:var(--text);border-color:var(--line2)}
  .links a svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .links a .badge{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;
    background:var(--warn);border:2px solid var(--bg)}

  footer{max-width:1100px;margin:0 auto;padding:12px 20px 26px;color:var(--dim2);
    font-size:12px;text-align:center;line-height:1.7}
  .verify{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
    font-size:11.5px}
  .verify a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--line2)}
  .verify a:hover{color:var(--acc)}

  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,10,.6);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    padding:16px}
  .modal.open{display:flex}
  .mcard{width:min(388px,100%);max-height:86vh;overflow:auto;background:#14171e;
    border:1px solid var(--line);border-radius:18px;padding:18px;
    animation:up .18s ease}
  @keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
    font-size:15.5px;font-weight:700}
  .mx{background:var(--box);border:0;color:var(--dim);width:28px;height:28px;border-radius:9px;
    cursor:pointer;font-size:15px;line-height:1}
  .mx:hover{color:var(--text)}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#191d26;border:1px solid transparent;border-radius:12px;padding:12px 14px;
    color:var(--text);font:600 14.5px inherit;cursor:pointer}
  .mlist button:hover{border-color:var(--acc)}
  .mlist img,.mlist .wicon{width:30px;height:30px;border-radius:8px;flex:0 0 auto}
  .wicon{background:var(--boxh);display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:14px}
  .mlist button>span:nth-child(2){flex:1;min-width:0}
  .mlist .sub{display:block;font-weight:500;font-size:11.5px;color:var(--dim2);margin-top:1px}
  .wtag{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--ok);
    background:rgba(37,192,127,.12);border-radius:999px;padding:3px 9px}
  .txl{color:var(--acc);text-decoration:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .txl:hover{text-decoration:underline}
  /* cash-out token rows */
  .corow{background:#191d26;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:8px}
  .cotop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .cotop b{font-size:14.5px} .cotop .tail{color:var(--dim2);font-size:11px;margin-left:4px}
  .cotop .amt{text-align:right} .cotop .amt b{color:var(--ok)}
  .cometa{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:11.5px;color:var(--dim2)}
  .slip{font-weight:700}
  .slip.low{color:var(--ok)} .slip.mid{color:var(--warn)} .slip.high{color:var(--bad)} .slip.vhigh{color:var(--bad)}
  .cowarn{font-size:11.5px;margin-top:6px;line-height:1.5;color:var(--warn)}
  .cowarn.vhigh{color:var(--bad)}
  .cobtns{display:flex;gap:8px;margin-top:8px}
  .cobtns .sbtn{flex:1;padding:8px 10px;font-size:12.5px}
  .cohead{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 2px;
    font-size:13px;color:var(--dim)}
  .mnote{font-size:13px;color:var(--dim);line-height:1.65;margin:10px 0}
  .mnote.err{color:var(--bad)}
  .mrow{display:flex;gap:8px;margin-top:10px}
  .sbtn{flex:1;background:var(--box);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 13px;font:600 13.5px inherit;cursor:pointer}
  .sbtn:hover{border-color:var(--line2)}
  .sbtn.primary{background:var(--acc);border:0;color:#fff}
  .sbtn:disabled{opacity:.4;cursor:not-allowed}
  .maddr{background:var(--box);border-radius:11px;padding:11px 13px;font-size:12.5px;
    word-break:break-all;color:var(--dim);margin-bottom:10px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  input.tx{width:100%;background:var(--box);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 13px;font:inherit;font-size:13px}
  input.tx:focus{outline:0;border-color:var(--line2)}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#191d26;border-radius:12px;padding:11px 14px;font-size:13px}
  .hrow .l{color:var(--dim)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.ok{background:rgba(37,192,127,.13);color:var(--ok)}
  .pill.warn{background:rgba(231,156,60,.13);color:var(--warn)}
  .pill.bad{background:rgba(236,95,95,.13);color:var(--bad)}
  .krow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;
    border-bottom:1px solid rgba(255,255,255,.04)}
  .krow:last-child{border-bottom:0}
  .krow span:first-child{color:var(--dim2)}
  .krow span:last-child{color:var(--dim);word-break:break-all;text-align:right}

  @media (max-width:560px){
    /* Phones: one row for identity, one for controls, and touch targets at or
       near the 44px both platforms ask for. */
    /* Two tidy rows: identity + connect on top, status + language beneath.
       Letting all three controls share one wrapped row made the header taller,
       not shorter. */
    header{padding:12px 14px 6px;display:grid;
      grid-template-columns:1fr auto;grid-template-areas:"brand wallet" "status lang";
      gap:8px 10px;align-items:center}
    .brand{grid-area:brand;font-size:16px}
    .hright{display:contents}
    .statuspill{grid-area:status;justify-self:start;padding:8px 12px}
    .lang{grid-area:lang;justify-self:end}
    .lang button{padding:9px 13px;font-size:12.5px}
    #h-wallet{grid-area:wallet;justify-self:end;padding:10px 15px}
    main{padding:6px 12px 32px}
    .card{padding:12px;border-radius:16px}
    /* 16px keeps iOS from zooming the page when the field is focused. */
    #amount,.recv{font-size:26px}
    input.tx{font-size:16px}
    /* Padding rather than height, so the row keeps its shape while the tap
       area grows to something a thumb can hit. */
    .maxb{padding:8px 11px;font-size:11.5px;margin-left:8px}
    .iconbtn{padding:10px}
    #dirswap{width:40px;height:40px}
    .links{gap:8px}
    .links a{flex:1 1 calc(50% - 4px);justify-content:center;padding:12px 10px}
    .mcard{padding:16px;border-radius:16px;max-height:88vh}
    .sbtn{padding:13px 13px}
    .cobtns .sbtn{padding:11px 10px}
    .flight{padding:11px 12px}
    footer{padding:10px 16px 22px}
  }
  /* Respect the iPhone home indicator / notch. */
  @supports(padding:max(0px)){
    body{padding-left:max(0px,env(safe-area-inset-left));
         padding-right:max(0px,env(safe-area-inset-right))}
    footer{padding-bottom:max(22px,env(safe-area-inset-bottom))}
  }
  /* On touch input, hover styling sticks after a tap; only apply it to mice. */
  @media (hover:none){
    .links a:hover,.sbtn:hover,.wbtn:hover{border-color:var(--line)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
.lnk{background:none;border:0;color:var(--acc);cursor:pointer;padding:0 2px;font:inherit;text-decoration:underline}
.gstep{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:12px 0}
.gstep b{display:block;color:var(--text);font-size:14px;margin-bottom:3px}
.gstep span{color:var(--dim);font-size:13px;line-height:1.55}
.firsthint{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;
  background:var(--box);color:var(--dim);font-size:13px;line-height:1.55;display:flex;
  justify-content:space-between;gap:10px;align-items:center}
.firsthint button{flex:0 0 auto}
</style>
</head>
<body>
<div class="bgfx"></div>

<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="24" y2="24">
        <stop offset="0" stop-color="#4c82fb"/><stop offset="1" stop-color="#6f5bff"/></linearGradient></defs>
      <circle cx="12" cy="12" r="8.6" stroke="url(#lg)" stroke-width="3.1"
        stroke-linecap="round" stroke-dasharray="38 16" transform="rotate(-50 12 12)"/>
    </svg>
    Arc Bridge
  </div>
  <div class="hright">
    <div class="statuspill" id="h-status"><span class="dot"></span><span id="h-status-t">…</span></div>
    <div class="lang">
      <button data-lang="ko" class="on">한국어</button><button data-lang="en">EN</button><button data-lang="zh">中文</button>
    </div>
    <button class="wbtn cta-like" id="h-wallet" data-t="cta_connect"></button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head"><span data-t="bridge"></span>
      <button class="iconbtn" id="refresh" title="refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button></div>

    <!-- transfers still in flight, restored from localStorage on load -->

  v_source:"源代码",
  g_first:"第一次使用？请先了解为什么会多次签名以及具体步骤。",
  g_intro:"用于把 Arc 上的 USDC 转出到其他链。所有交易都在你自己的钱包中签名，本站不保管任何资金。",
  g_s1_t:"1. 连接钱包", g_s1_b:"点击右上角按钮，选择持有 Arc USDC 的钱包。若钱包中没有 Arc 网络，会提示添加。",
  g_s2_t:"2. 金额与接收地址", g_s2_b:"输入要转出的金额。接收地址默认为已连接的钱包，如需转到别处请点击更改。地址填错无法撤回，请务必核对。",
  g_s3_t:"3. 签名", g_s3_b:"按屏幕提示的次数在钱包中确认：一次授权、一次或多次 Arc 销毁、以及目标链上一次领取。",
  g_s4_t:"4. 确认到账", g_s4_b:"销毁与领取完成后，资金会出现在目标链余额中。进行中的转账会显示在页面上方。",

/* Failover with memory. Arc has exactly two community RPCs and no official
   public one; while this was being built the primary started answering 403 and
   the other dropped the occasional call. Walking the list in fixed order made
   every request pay the dead endpoint's failure first. So remember, per list,
   which endpoint answered last, and start there next time. A ?" in d" check is
   not enough either: a proxy that errors still returns JSON, so an explicit
   error object counts as a miss and moves on. */
const RPC_GOOD=new Map();
async function rpcVia(urls,method,params){
  let last=null;
  const key=urls.join("|");
  const fav=RPC_GOOD.get(key);
  const order=fav&&urls.includes(fav)?[fav,...urls.filter(u=>u!==fav)]:urls;
  // Two passes with a breather between them: the surviving endpoint drops the
  // odd call under a burst, and one immediate retry list-wide was not enough
  // to ride that out.
  for(let pass=0;pass<2;pass++){
  if(pass>0) await new Promise(r=>setTimeout(r,900));
  for(const url of order){
    for(let i=0;i<2;i++){
      // A dead endpoint that hangs instead of erroring would otherwise hold
      // every caller for the browser's default fetch timeout. Cap it.
      const ab=new AbortController();
      const timer=setTimeout(()=>ab.abort(),12000);
      try{
        const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({jsonrpc:"2.0",id:1,method,params}),signal:ab.signal});
        const d=await r.json();
        if("result" in d){ RPC_GOOD.set(key,url); return d.result; }
        last=d.error&&d.error.message;
      }catch(e){ last=e.message; }
      finally{ clearTimeout(timer); }
    }
  }
  }
  throw new Error("RPC no answer ("+(last||"?")+")");
}

/* ============ status (exit-open guard) ============ */
/* Is Circle signing Arc burns right now? Sample SEVERAL recent burns, not one.
   Judging by the single latest burn declares the bridge dead whenever that one
   burn is newer than Circle's signing delay, which would block every user for
   no reason. One attested burn among the sample proves the lane is alive. */
async function checkAttesting(){
  const head=Number(numHex(await rpcRead("eth_blockNumber",[])));
  // Skip only the last few minutes. A burn seconds old is not indexed by Circle
  // yet, so asking about it answers nothing. Everything older is fair game: an
  // earlier version threw away the newest hour entirely, and Arc is quiet
  // enough that the remaining windows held no burns at all, which the code then
  // read as a dead lane and used to block withdrawals on a working bridge.
  const SKIP=600;      // ~5 minutes at 0.507s blocks
  const SPAN=9999;     // the RPCs cap eth_getLogs at a 10,000 block range
  const found=[];
  for(let w=0;w<8&&found.length<4;w++){
    const to=head-SKIP-w*(SPAN+1), from=to-SPAN;
    if(to<=0) break;
    try{ const logs=await rpcRead("eth_getLogs",[{topics:[TOPIC_DEPOSIT_BURN],
      fromBlock:hexNum(Math.max(0,from)),toBlock:hexNum(to)}]);
      // Walk newest-first but keep a spread, so one busy moment cannot
      // monopolise the sample.
      for(let i=(logs||[]).length-1;i>=0&&found.length<4;i--){
        const h=logs[i].transactionHash;
        if(!found.some(f=>f.hash===h))
          found.push({hash:h,block:Number(numHex(logs[i].blockNumber))});
      }
    }catch(e){}
  }
  // Finding nothing to sample means the question could not be asked. On a chain
  // this quiet that is ordinary, and it is not evidence the lane is shut.
  if(!found.length) return {open:false,done:0,total:0,unknown:true};
  let done=0,total=0,seen=0;
  for(const f of found){
    try{
      const r=await fetch(IRIS+"/messages/"+ARC_DOMAIN+"?transactionHash="+f.hash);
      const d=await r.json(); const msgs=(d&&d.messages)||[];
      if(!msgs.length) continue;
      seen++;
      total+=msgs.length;
      done+=msgs.filter(m=>m.status==="complete"&&String(m.attestation||"").startsWith("0x")).length;
      if(done>0) break;   // one attested burn is enough to prove the lane works
    }catch(e){}
  }
  if(!seen) return {open:false,done:0,total:0,unknown:true};
  // Nothing attested yet only means a stall if something in the sample is old
  // enough that Circle should already have signed it. A sample of burns minutes
  // old proves nothing either way.
  const RIPE=1800;     // ~15 minutes
  if(done===0&&!found.some(f=>head-f.block>RIPE))
    return {open:false,done,total,unknown:true};
  return {open:done>0,done,total};
}

// The service rate lives on-chain and can be retuned, so read it once and
// cache it rather than baking a number into the page that could go stale.
const DEFAULT_FEE_BPS=200;   // used only when the live rate cannot be read
// Deposits are charged the same 3% as withdrawals, taken on the source chain.
const DEPOSIT_FEE_BPS=200;
// Relayer pickup tag, read out of delivered transfers' DepositForBurn events.
const HOOK_TAG="0x636374702d666f7277617264";   // ascii "cctp-forward"
// Just above the observed 0.0172 charge; the tag ecosystem pays exact quotes.
const FWD_MAX_FEE=20000n;
const FEE_RECIPIENT="0x20f7F91a102F711099509d0044EdFC351Fe18fF8";
let FEE_BPS_CACHE=null;
/* Operator wallets pay nothing. On the withdrawal side the contract enforces
   this via feeExempt, so the page must read it rather than assume, or it would
   quote and approve a fee the contract will not take. On the deposit side
   there is no contract, so the page skips the fee transfer for the same
   addresses. Checked live per account, never hardcoded to a build. */
let EXEMPT_CACHE={};
// Mirrors the async check so synchronous renders can quote the right number.
// Starts true on a local run with no contract, so the first render (before any
// wallet is connected) quotes the operator rate instead of flashing 2%. With a
// contract deployed the chain decides, so it starts false and is filled in by
// the live read.
let EXEMPT_NOW=NOFEE&&!BATCH_CONTRACT;
async function isFeeExempt(who){
  if(!who) return false;
  const k=who.toLowerCase();
  // Once a batch contract exists it is the authority, and the local override
  // must not answer for it: the page passes the rate it believes into
  // batchExit, and a local "free" that the contract does not share makes every
  // batch revert with FeeChangedMidFlight. Local-free only applies to the
  // page-collected fee, which is the no-contract path.
  // Set synchronously so the render that follows this call quotes it correctly.
  if(NOFEE&&!BATCH_CONTRACT){ EXEMPT_CACHE[k]=true; EXEMPT_NOW=true; return true; }
  if(EXEMPT_CACHE[k]!==undefined) return EXEMPT_CACHE[k];
  let ex=false;
  if(BATCH_CONTRACT){
    try{ const v=await ethCall(BATCH_CONTRACT,SEL.feeExempt+pad32(who));
      ex=(numHex(v)===1n); }catch(e){ ex=false; }
  }
  EXEMPT_CACHE[k]=ex;
  if(ACCT&&ACCT.toLowerCase()===k){ EXEMPT_NOW=ex; renderDetails(); }
  return ex;
}
async function liveFeeBps(){
  if(ACCT&&await isFeeExempt(ACCT)) return 0;
  if(FEE_BPS_CACHE!==null) return FEE_BPS_CACHE;
  if(!BATCH_CONTRACT){ FEE_BPS_CACHE=0; return 0; }
  try{
    const v=await ethCall(BATCH_CONTRACT,SEL.feeBps);
    // An empty answer means the call did not reach a contract, not that the
    // fee is zero. Reading it as zero would under-quote the user and make the
    // contract reject their transaction, so fall back to the expected rate.
    const ok=typeof v==="string"&&strip(v).length>=2;
    const n=ok?Number(numHex(v)):NaN;
    FEE_BPS_CACHE=(Number.isFinite(n)&&n>=0&&n<=500)?n:DEFAULT_FEE_BPS;
  }catch(e){ FEE_BPS_CACHE=DEFAULT_FEE_BPS; }
  renderDetails();
  return FEE_BPS_CACHE;
}
// The contract pulls principal + fee, so from a user-entered send amount X the
// principal that actually crosses is X / (1 + rate). Deposits are free.
// The fee applies with or without the batch contract: with it the contract
// takes it, without it the page sends it as a transfer first. Either way the
// number quoted here is what the user actually receives.
function feeApplied(a){
  if(EXEMPT_NOW) return a;
  if(DIR==="in") return a*10000n/(10000n+BigInt(DEPOSIT_FEE_BPS));
  const bps=BigInt(BATCH_CONTRACT
    ? (FEE_BPS_CACHE===null?DEFAULT_FEE_BPS:FEE_BPS_CACHE)
    : DEFAULT_FEE_BPS);
  return a*10000n/(10000n+bps);
}
// Burns per batchExit call. The contract allows 600, but measured reality is
// ~45k gas per burn against a 30M block limit - 600 would fill 90% of a block
// and fail whenever it is not empty. 400 (~18M, 60%) always fits.
const BURNS_PER_CALL=400n;
// How many batchExit signatures a principal of P needs (BURNS_PER_CALL burns
// per call, plus one extra call when there is a sub-cap remainder).
function batchCalls(P,cap){
  const full=Number(P/cap), rem=P%cap>0n?1:0;
  return Math.max(1,Math.ceil(full/Number(BURNS_PER_CALL))+rem);
}
function renderDetails(){
  $("det-addr").textContent=RECIP?short(RECIP):(ACCT?short(ACCT):t("cta_connect"));
  // Deposits ride Circle's paid fast lane, so quote that ceiling honestly
  // rather than claiming the transfer is free.
  // Deposits buy the fast lane, so quote that cost rather than claiming free.
  if(EXEMPT_NOW){ $("det-fee").textContent=t("fee_exempt"); }
  else if(DIR==="in"){
    $("det-fee").textContent=(DEPOSIT_FEE_BPS/100).toFixed(2)+"%";
  }else{
    const bps=BATCH_CONTRACT?(FEE_BPS_CACHE===null?DEFAULT_FEE_BPS:FEE_BPS_CACHE):DEFAULT_FEE_BPS;
    $("det-fee").textContent=(bps/100).toFixed(2)+"%";
  }
  $("det-route").textContent=t("route_v");
  const amt=parseUsdc($("amount").value);
  if(DIR==="out"){
    const eff=feeApplied(amt||0n);
    const n=eff>0n?Number((eff+LIMIT_ARC-1n)/LIMIT_ARC):1;
    if(amt&&n>1){
      $("row-split").hidden=false;
      // Both halves, not just the burn. Quoting only the Arc side said "about 2"
      // and then asked for four more on Base, which is worse than saying nothing.
      let src,dst;
      if(BATCH_CONTRACT){ src=1+batchCalls(eff,LIMIT_ARC); }   // approve + batchExit calls
      else{ src=WALLET_BATCH?2:(n+1); }
      if(CLAIM_CONTRACT&&DST.chainId===BASE_CHAIN_ID) dst=Math.ceil(n/Math.max(1,CLAIM_PER_CALL));
      else dst=WALLET_BATCH?Math.ceil(n/Math.max(1,batchHint(DST.chainId))):n;
      const sigs=src+dst;
      $("det-split").textContent=n+" × "+usdc(LIMIT_ARC)+" USDC · "
        +t("sig_about")+" "+sigs+t("sig_times")+" ("+DST.name+" "+dst+")";
      $("row-split").classList.toggle("warn",sigs>10);
      /* Suggest an amount that costs one signature less.
         Two things add a call. A principal over 400 USDC needs another
         batchExit, and - less obviously - a principal with a fractional
         remainder needs its own call for that last sub-1-USDC piece, because
         batchExit burns a uniform amountEach. The fee makes that remainder the
         normal case: type 400 at 2% and the principal is 392.156862, so the
         quote jumps to four. Round the principal down to whole USDC and quote
         the spend that lands there, which is always at or below what was
         typed - never ask for more money to save a click. */
      const tip=$("split-tip");
      const bpsNow=EXEMPT_NOW?0:(BATCH_CONTRACT
        ? (FEE_BPS_CACHE===null?DEFAULT_FEE_BPS:FEE_BPS_CACHE) : DEFAULT_FEE_BPS);
      const whole=eff/LIMIT_ARC;                       // full 1-USDC pieces
      const hasRem=(eff%LIMIT_ARC)>0n;
      // Only drop the fractional tail. Clamping to 400 as well would tell
      // someone withdrawing 800 to send 408, which is not advice, it is asking
      // them to move half their money.
      const want=whole*LIMIT_ARC*(10000n+BigInt(bpsNow))/10000n;
      const better=hasRem&&whole>0n&&want>0n&&want<amt;
      if(better){
        const txt=usdc(want);
        tip.hidden=false;
        tip.innerHTML=t("tip_opt_a")+'<button class="lnk" id="tip-opt">'+txt
          +' USDC</button>'+t("tip_opt_b");
        const b=$("tip-opt");
        if(b) b.onclick=()=>{ $("amount").value=txt; renderDetails(); updateCTA(); };
      }else tip.hidden=true;
    }else{
      // Hide the suggestion too. Leaving it up meant a 0.5 USDC entry still
      // showed advice computed for the previous, much larger amount.
      $("row-split").hidden=true;
      $("split-tip").hidden=true;
    }
    // Signing dominates the wait, and measured Arc burns were signed well
    // inside half an hour, so quote a range instead of a flattering single
    // number. Many pieces add signing time on top.
    const base=BATCH_CONTRACT?10:Math.max(5,Math.ceil(n*1.5));
    $("det-time").textContent=base>=60
      ? t("time_about")+" "+Math.round(base/60)+t("hour")
      : base+"~"+(base+20)+t("min");
  }else{
    $("row-split").hidden=true;
    // The fast lane skips waiting on Base finality, so this is minutes.
    $("det-time").textContent=t("time_dep");
  }
  // Deposits get a standing caution, not just a hint. Circle's delivery into
  // Arc is sporadic (the last inbound from Base landed days before this was
  // written, and a real test sat pending for hours), and a user deserves to
  // know that before committing rather than after.
  const hint=$("dir-hint");
  hint.classList.remove("caution");
  hint.textContent=t(DIR==="out"?(BATCH_CONTRACT?"hint_out_b":"hint_out"):"hint_in");
  const rc=$("receive");
  rc.classList.toggle("haveamt",!!(amt&&amt>0n));
  rc.textContent=amt&&amt>0n?usdc(feeApplied(amt)):"0";
}
function updateCTA(){
  const b=$("cta");
  const amt=parseUsdc($("amount").value);
  const bal=DIR==="out"?ARC_BAL:BASE_BAL;
  b.classList.remove("danger");
  if(RUNNING){ b.disabled=true; b.textContent=t("cta_running"); return; }
  if(!ACCT){ b.disabled=false; b.textContent=t("cta_connect"); return; }
  if(!amt||amt<=0n){ b.disabled=true; b.textContent=t("cta_amount"); return; }
  if(bal!==null&&amt>bal){ b.disabled=true; b.textContent=t("cta_insuf"); return; }
  if(DIR==="out"){
    if(STATUS==="checking"){ b.disabled=true; b.textContent=t("cta_checking"); return; }
    // Only "shut" blocks. "unknown" means the one Arc RPC did not answer this
    // round, not that Circle stopped signing - and with a single endpoint that
    // will happen. Blocking on it would strand a user whose funds are fine, so
    // let them proceed; the burn itself re-checks and the funds are recoverable
    // regardless.
    if(STATUS==="shut"){ b.disabled=true; b.classList.add("danger"); b.textContent=t("cta_shut"); return; }
  }
  b.disabled=false; b.textContent=t(DIR==="out"?"cta_out":"cta_in");
}

/* ============ tx plumbing ============ */
async function ensureChain(chainId){
  const cur=Number(numHex(await eth().request({method:"eth_chainId"})));
  if(cur===chainId) return;
  const src=SOURCES.find(x=>x.chainId===chainId);
  const hexId=chainId===ARC_CHAIN_ID?ARC_HEX:(src?src.hex:BASE_HEX);
  try{ await eth().request({method:"wallet_switchEthereumChain",params:[{chainId:hexId}]}); }
  catch(e){
    if(chainId===ARC_CHAIN_ID){
      await eth().request({method:"wallet_addEthereumChain",params:[{chainId:ARC_HEX,
        chainName:"Arc",nativeCurrency:{name:"USDC",symbol:"USDC",decimals:18},
        rpcUrls:ARC_RPCS.slice(0,2),blockExplorerUrls:[]}]});
      await eth().request({method:"wallet_switchEthereumChain",params:[{chainId:ARC_HEX}]});
    }else throw e;
  }
}
async function sendTx(to,data,chainWanted,gasFloor){
  await ensureChain(chainWanted);
  const tx={from:ACCT,to,data};
  /* Feed the gas fields from a live RPC on every chain, not just Arc.
     Without them OKX reports "Network fee estimation unsuccessful" and greys
     out Confirm. This was known for Arc and left unfixed everywhere else, so
     the destination claim silently failed and fell back to wallet batching -
     which is exactly the pile of confirmations the claim contract exists to
     remove. A large claim also needs far more gas than a wallet's default
     guess, which is what gasFloor is for. */
  const reader=chainWanted===ARC_CHAIN_ID
    ? rpcRead
    : (m,p)=>{ const s=SOURCES.find(x=>x.chainId===chainWanted);
        return s?rpcVia(s.rpcs,m,p):dstRead(m,p); };
  try{
    let gas;
    try{ gas=await reader("eth_estimateGas",[{from:ACCT,to,data}]);
      gas=hexNum(numHex(gas)*13n/10n); }
    catch(e){ gas=hexNum(BigInt(gasFloor||600000)); }
    tx.gas=gas;
    const blk=await reader("eth_getBlockByNumber",["latest",false]);
    const base=(blk&&blk.baseFeePerGas)?numHex(blk.baseFeePerGas):0n;
    if(base>0n){
      let tip=chainWanted===ARC_CHAIN_ID?2000000000n:1000000n;
      try{ const v=numHex(await reader("eth_maxPriorityFeePerGas",[])); if(v>0n) tip=v; }catch(e){}
      tx.maxPriorityFeePerGas=hexNum(tip); tx.maxFeePerGas=hexNum(base*2n+tip);
    }else{ const p=await reader("eth_gasPrice",[]); tx.gasPrice=hexNum(numHex(p)*12n/10n); }
    try{ tx.nonce=await reader("eth_getTransactionCount",[ACCT,"pending"]); }catch(e){}
  }catch(e){}
  return eth().request({method:"eth_sendTransaction",params:[tx]});
}
/* Wallet-side batching (EIP-5792). Arc caps a CCTP message at 1 USDC, so a $10
   exit is ten burns and, on a plain EOA, ten confirmations. The batch contract
   fixes that but has to be deployed and funded first. A wallet that implements
   the Wallet Call API does the same job with no contract at all: the fee, the
   approval and every burn go out under one confirmation. Support is per chain
   and most wallets have not wired up Arc, so it is asked for, never assumed,
   and the one-at-a-time path stays as the fallback. */
async function walletBatchOK(chainHex){
  try{
    const caps=await eth().request({method:"wallet_getCapabilities",params:[ACCT,[chainHex]]});
    const c=caps&&(caps[chainHex]||caps[String(chainHex).toLowerCase()]);
    if(!c) return false;
    // Two shapes are in the wild: the current atomic.status, and atomicBatch
    // .supported from the earlier draft.
    const st=c.atomic&&String(c.atomic.status||"").toLowerCase();
    if(st==="supported"||st==="ready") return true;
    return !!(c.atomicBatch&&c.atomicBatch.supported);
  }catch(e){ return false; }
}
async function sendCalls(calls,chainHex){
  const res=await eth().request({method:"wallet_sendCalls",params:[{
    version:"2.0.0",from:ACCT,chainId:chainHex,atomicRequired:true,
    calls:calls.map(c=>({to:c.to,data:c.data}))}]});
  return (res&&res.id)?res.id:res;   // 2.0.0 returns {id}; the draft returned a string
}
/* onSeen fires the moment the wallet reveals a transaction hash, before the
   batch is confirmed. Once the burn is on chain the funds are already inside
   Circle, and the only way to collect them later is that hash, so it has to be
   written down before anything else can go wrong: a closed tab or a dropped
   connection between here and confirmation must not lose it. */
async function waitCalls(id,onTick,onSeen){
  const told=new Set();
  for(let i=0;i<200;i++){
    await new Promise(r=>setTimeout(r,3000));
    let s=null;
    try{ s=await eth().request({method:"wallet_getCallsStatus",params:[id]}); }catch(e){ continue; }
    const code=Number(s&&s.status);
    onTick&&onTick(code,i);
    const rc=(s&&s.receipts)||[];
    const hashes=[...new Set(rc.map(r=>r&&r.transactionHash).filter(Boolean))];
    if(onSeen) for(const h of hashes) if(!told.has(h)){ told.add(h); onSeen(h); }
    // 400 = the wallet/chain refused it before execution, so nothing was spent.
    // 500 = it executed and reverted, which did cost gas. Tag the error so the
    // caller can retry cheaply in the first case and back off hard in the second.
    if(code>=400){
      const err=new Error("batch rejected, status "+code);
      err.status=code; err.free=(code<500);
      throw err;
    }
    if(code===200||String(s&&s.status).toUpperCase()==="CONFIRMED"){
      if(rc.some(r=>r&&r.status!==undefined&&numHex(r.status)===0n))
        throw new Error("execution reverted");
      // Atomic execution puts every call in one transaction, so dedupe.
      return hashes;
    }
  }
  throw new Error("no receipt");
}
async function waitReceipt(txHash,chain){
  const rsrc=SOURCES.find(x=>x.chainId===chain);
  const reader=chain===ARC_CHAIN_ID?rpcRead:(rsrc?(m,pp)=>rpcVia(rsrc.rpcs,m,pp):baseRead);
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,3000));
    try{ const rec=await eth().request({method:"eth_getTransactionReceipt",params:[txHash]});
      if(rec) return rec; }catch(e){}
    try{ const rec=await reader("eth_getTransactionReceipt",[txHash]);
      if(rec) return rec; }catch(e){}
  }
  throw new Error("no receipt: "+txHash);
}
function encodeTwoBytes(aHex,bHex){
  const a=strip(aHex),b=strip(bHex),aLen=a.length/2,bLen=b.length/2;
  const aPad=a+"".padEnd((32-(aLen%32))%32*2,"0"), bPad=b+"".padEnd((32-(bLen%32))%32*2,"0");
  const off1=64, off2=off1+32+aPad.length/2;
  return pad32(hexNum(off1))+pad32(hexNum(off2))+pad32(hexNum(aLen))+aPad+pad32(hexNum(bLen))+bPad;
}
// 160 ticks x 15s = 40 minutes. Base-sourced messages wait on Base finality
// (~15 min typical, longer when the network is busy), and the old 20-minute
// ceiling was reporting healthy transfers as failures.
/* Choosing the CCTP lane, learned the hard way.

   maxFee is a CEILING, not a price: Circle deducts only what it actually
   charges. A real deposit stalled for hours because the ceiling was set to
   0.1% of the amount, below the ~0.017 USDC Circle actually wanted, so the
   message could never be executed.

   Circle publishes a free "finalized" lane (threshold 2000) on every route,
   but decoding the messages that genuinely arrived on Arc shows every one of
   them executed on the paid fast lane (1000). With no observed evidence that
   the free lane delivers here, the paid one is used wherever it costs money,
   with a ceiling generous enough to actually execute. Where Circle charges
   nothing (Arc->Base) the ceiling stays at zero, so no fee can ever be taken. */
/* Picking the lane, decided by decoding what actually arrived on Arc.

   The decisive fact: in every message observed landing, feeExecuted equalled
   maxFee exactly. Circle takes the whole ceiling rather than trimming it to a
   real cost, so a "generous" ceiling is not caution, it is an overcharge the
   user silently pays.

   Consequences:
    - Where Circle prices the lane at zero, set the ceiling to zero. Nothing
      can then be deducted. Arc->Base is such a lane, and it is the one proven
      with real funds.
    - Base->Arc is only free on the finalized lane, which has been observed
      delivering 495 and 589 USDC. Its fast lane carries a price we cannot
      pin down (the published number does not match anything actually charged),
      and no Base->Arc fast transfer has ever been observed, so paying a
      guessed ceiling there would be both an overcharge and unproven.

   So: take the cheapest lane Circle prices at zero, and never set a ceiling
   above zero on a lane priced at zero. */
/* Always take the fast lane (threshold 1000), paying for it where Circle
   charges. Timing fourteen arrivals settled why this matters, and it is not
   the source chain: every one of the eleven that came in on the fast lane
   landed within minutes, while all three that took the free finalized lane
   waited between 8.9 and 11.6 DAYS. The lane is the whole difference.

   Where Circle prices the fast lane at zero (Arc->Base) the ceiling stays
   zero, so nothing is deducted. Where it charges (Base->Arc) we allow a few
   cents: observed fast-lane charges are around 0.017 USDC, and since Circle
   consumes whatever ceiling is offered, the ceiling is kept small rather than
   generous. Paying five cents to avoid a ten-day wait is not a close call. */
const LANE_CACHE={};
const FAST_FEE_FLOOR=50000n;           // 0.05 USDC
// Headroom carried on routes Circle currently quotes at zero. Small enough that
// it cannot eat a 1 USDC piece, large enough to survive a quote change.
const FREE_LANE_CEILING=10000n;        // 0.01 USDC
function fastCeiling(amount){
  const pct=amount/1000n;              // 0.1% for large transfers
  return pct>FAST_FEE_FLOOR?pct:FAST_FEE_FLOOR;
}
async function pickLane(srcDomain,dstDomain,amount){
  const key=srcDomain+">"+dstDomain;
  if(LANE_CACHE[key]===undefined){
    let costs=true;                    // unknown pricing is treated as paid
    try{
      const r=await fetch(IRIS+"/burn/USDC/fees/"+srcDomain+"/"+dstDomain);
      const d=await r.json();
      const list=Array.isArray(d)?d:((d&&d.value)||[]);
      const fast=list.find(o=>Number(o.finalityThreshold)===1000);
      if(fast&&Number(fast.minimumFee)===0) costs=false;
    }catch(e){}
    LANE_CACHE[key]=costs;
  }
  const costs=LANE_CACHE[key];
  // maxFee is a ceiling, not a payment: Circle charges the real fee and nothing
  // more, so a route quoted at zero still gets one. A burn signed while the
  // quote says free becomes undeliverable if the price moves before it lands,
  // which is exactly how a transfer got stranded once. The ceiling costs the
  // user nothing while the route stays free, and saves the transfer if it does
  // not. Quoted-paid routes keep the wider ceiling.
  return {finality:1000, free:!costs,
          maxFee:costs?fastCeiling(amount||0n):FREE_LANE_CEILING};
}
/* Every attested message in one transaction, not just the first. A batched burn
   puts many CCTP messages under a single hash, and taking [0] would mint one
   piece and silently strand the rest. Correct for plain single-message txs too,
   where it returns a one-element list. */
async function pollAttestationAll(txHash,srcDomain,onTick){
  for(let i=0;i<160;i++){
    try{
      const r=await fetch(IRIS+"/messages/"+srcDomain+"?transactionHash="+txHash);
      const d=await r.json(); const msgs=(d&&d.messages)||[];
      const done=msgs.filter(m=>m.status==="complete"&&String(m.attestation||"").startsWith("0x"));
      if(msgs.length&&done.length===msgs.length) return done;
      onTick&&onTick(msgs.length?(done.length+"/"+msgs.length):"indexing",i);
    }catch(e){ onTick&&onTick("retry",i); }
    await new Promise(r=>setTimeout(r,15000));
  }
  return [];
}
async function pollAttestation(txHash,srcDomain,onTick){
  for(let i=0;i<160;i++){
    try{ const r=await fetch(IRIS+"/messages/"+srcDomain+"?transactionHash="+txHash);
      const d=await r.json(); const m=((d&&d.messages)||[])[0];
      if(m&&m.status==="complete"&&String(m.attestation||"").startsWith("0x")) return m;
      onTick&&onTick(m?(m.status||"pending"):"indexing",i);
    }catch(e){ onTick&&onTick("retry",i); }
    await new Promise(r=>setTimeout(r,15000));
  }
  return null;
}

/* ============ in-flight tracker ============
   "Did my money move?" must be answerable by looking at the page, including
   after a reload, so unfinished burns are read back from localStorage and
   checked against Circle on every visit. */
let FLIGHT_TIMER=null;
function minsSince(iso){
  const t=Date.parse(iso+(iso&&iso.length===16?":00Z":""));
  if(isNaN(t)) return null;
  return Math.max(0,Math.round((Date.now()-t)/60000));
}
async function refreshInflight(){
  const el=$("inflight"); if(!el) return;
  const open=loadBurns().filter(r=>!r.minted&&HASH_RE.test(String(r.tx||""))).slice(0,3);
  if(!open.length){ el.innerHTML=""; if(FLIGHT_TIMER){clearInterval(FLIGHT_TIMER);FLIGHT_TIMER=null;} return; }
  const rows=[];
  for(const r of open){
    const rs=r.src?srcByKey(r.src):SOURCES[0];
    const srcDomain=r.dir==="in"?rs.domain:ARC_DOMAIN;
    const chain=r.dir==="in"?rs.chainId:ARC_CHAIN_ID;
    let status="checking",ready=false;
    try{
      const q=await fetch(IRIS+"/messages/"+srcDomain+"?transactionHash="+r.tx);
      const d=await q.json(); const msgs=(d&&d.messages)||[];
      const done=msgs.filter(m=>m.status==="complete"&&String(m.attestation||"").startsWith("0x"));
      if(done.length){ status="ready"; ready=true; }
      else if(msgs.length) status=msgs[0].status||"pending";
      else status="indexing";
    }catch(e){ status="offline"; }
    const mins=minsSince(r.at);
    const amt=usdc(BigInt(r.amount||"0"));
    const way=r.dir==="in"?t("h_in"):t("h_out");
    if(ready){
      // While a withdrawal is running it is already collecting this very burn.
      // Offering a second Claim button next to it invited pressing both, which
      // spends gas twice on work the running flow is about to do.
      rows.push('<div class="flight done">'
        +'<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        +'<div class="body"><b>'+amt+' USDC '+way+'</b> · '+t("fl_ready")
        +'<div class="sub">'+(RUNNING?t("fl_auto"):txLink(r.tx,chain))+'</div></div>'
        +(RUNNING?"":'<button class="act" data-claim="'+esc(r.tx)+'">'+t("rec_go")+'</button>')
        +'</div>');
    }else{
      // Three tiers, because "taking a while" stops being reassuring after an
      // hour and says nothing about what to do next.
      const m=mins===null?0:mins;
      const tier=m>120?2:(m>25?1:0);
      const age=mins===null?"":" ("+(m>=60?Math.floor(m/60)+t("hour")+" "+(m%60):m)+t("min")+")";
      rows.push('<div class="flight'+(tier?" stale":"")+'">'
        +'<div class="spinner"></div>'
        +'<div class="body"><b>'+amt+' USDC '+way+'</b> · '+t("fl_wait")+age
        +'<div class="sub">'+t(tier===2?"fl_stuck":tier===1?"fl_slow":"fl_note")
        +' '+txLink(r.tx,chain)+'</div></div></div>');
    }
  }
  el.innerHTML=rows.join("");
  el.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>{
    $("burntx").value=b.getAttribute("data-claim"); openM("m-recover"); recover(true);
  });
  if(!FLIGHT_TIMER) FLIGHT_TIMER=setInterval(()=>refreshInflight().catch(()=>{}),30000);
}
function updateRecBadge(){
  const any=loadBurns().some(r=>!r.minted&&r.dir!=="in");
  $("rec-badge").hidden=!any;
  refreshInflight().catch(()=>{});
}
